<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12141A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AEROFRAME 1.0" />
  <title>AEROFRAME V1.0 — Endurance & Aesthetic Hybrid System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12141A;
      --s1: #1A1D24;
      --s2: #22262F;
      --s3: #2C313D;
      --border: #2E3440;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --gold: #D4AF37;
      --gold-dim: rgba(212, 175, 55, 0.15);
      --green: #10B981;
      --green-dim: rgba(16, 185, 129, 0.15);
      --red: #EF4444;
      --red-dim: rgba(239, 68, 68, 0.16);
      --ora: #F59E0B;
      --ora-dim: rgba(245, 158, 11, 0.15);
      --cyan: #38BDF8;
      --cyan-dim: rgba(56, 189, 248, 0.15);
      --font-head: 'Rajdhani', sans-serif;
      --font-body: 'Sora', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0B0C10;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13.5px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg);
      min-height: 100vh;
      position: relative;
      padding-bottom: 92px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255,255,255,0.04);
      border-right: 1px solid rgba(255,255,255,0.04);
    }

    /* TOP HEADER */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 20, 26, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
    }

    .top-row-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-sub {
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 500;
      display: block;
      margin-top: -2px;
    }

    .btn-audio-test {
      background: var(--s2);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-audio-test:active {
      transform: scale(0.96);
      background: var(--cyan-dim);
    }

    .btn-audio-test.unlocked {
      color: var(--green);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .top-row-2 {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .phase-select {
      flex: 1;
      background: var(--s1);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .badge-pill {
      padding: 4px 8px;
      border-radius: 6px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-gold { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(212,175,55,0.35); }
    .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.35); }
    .badge-ora { background: var(--ora-dim); color: var(--ora); border: 1px solid rgba(245,158,11,0.35); }
    .badge-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.35); }
    .badge-cyan { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(56,189,248,0.35); }

    /* MAIN CONTENT CONTAINER */
    .main-view {
      padding: 12px 14px;
    }

    /* CARDS & PANELS */
    .card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 12px;
    }

    .card-gold {
      border-color: rgba(212, 175, 55, 0.45);
      background: linear-gradient(180deg, rgba(212,175,55,0.07) 0%, var(--s1) 100%);
    }

    .card-green {
      border-color: rgba(16, 185, 129, 0.45);
      background: linear-gradient(180deg, rgba(16,185,129,0.07) 0%, var(--s1) 100%);
    }

    .card-ora {
      border-color: rgba(245, 158, 11, 0.45);
      background: linear-gradient(180deg, rgba(245,158,11,0.08) 0%, var(--s1) 100%);
    }

    .card-red {
      border-color: rgba(239, 68, 68, 0.55);
      background: linear-gradient(180deg, rgba(239,68,68,0.12) 0%, var(--s1) 100%);
    }

    .card-cyan {
      border-color: rgba(56, 189, 248, 0.45);
      background: linear-gradient(180deg, rgba(56,189,248,0.08) 0%, var(--s1) 100%);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-title {
      font-family: var(--font-head);
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text);
      line-height: 1.25;
    }

    .section-label {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* INPUTS & GRIDS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .field-box {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
    }

    .field-box label {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 500;
    }

    .field-box input, .field-box select {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-head);
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    .field-box input::placeholder {
      color: rgba(156, 163, 175, 0.4);
    }

    /* TOGGLE SWITCHES */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }

    .toggle-row span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .switch-pill {
      width: 40px;
      height: 22px;
      background: var(--s3);
      border-radius: 99px;
      position: relative;
      transition: 0.2s;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .switch-pill::after {
      content: '';
      width: 16px;
      height: 16px;
      background: var(--muted);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.2s;
    }

    .switch-pill.on {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    .switch-pill.on::after {
      background: var(--gold);
      transform: translateX(18px);
    }

    /* DAY BAR SELECTOR (MON - SUN) */
    .day-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 10px 0 12px;
    }

    .day-btn {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .day-btn .d-name {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      display: block;
    }

    .day-btn .d-tag {
      font-size: 9.5px;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }

    .day-btn.active {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    .day-btn.active .d-name {
      color: var(--gold);
    }

    .day-btn.done-day::after {
      content: '';
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
      position: absolute;
      top: 4px;
      right: 4px;
    }

    /* EXERCISE SETS & BUTTONS */
    .meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
    }

    .meta-chip {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--s2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .meta-chip b {
      color: var(--text);
    }

    .warn-banner {
      background: var(--ora-dim);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #FDE68A;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 500;
      margin-bottom: 9px;
    }

    .danger-banner {
      background: var(--red-dim);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #FECACA;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .sets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .set-btn {
      flex: 1;
      min-width: 72px;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 8px;
      border-radius: 8px;
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s;
    }

    .set-btn.completed {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }

    .action-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s;
    }

    .btn:active { transform: scale(0.97); }
    .btn-gold { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .btn-green { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .btn-cyan { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }
    .btn-red { background: var(--red-dim); border-color: var(--red); color: var(--red); }

    .info-box {
      background: var(--s2);
      border-left: 3px solid var(--gold);
      padding: 9px 11px;
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      color: #D1D5DB;
      white-space: pre-line;
      margin-top: 8px;
      display: none;
    }

    .info-box.open {
      display: block;
    }

    /* ACCORDION */
    .acc-header {
      width: 100%;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      margin-bottom: 8px;
    }

    .acc-body {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      margin-top: -4px;
      margin-bottom: 10px;
      display: none;
    }

    .acc-body.open {
      display: block;
    }

    /* FLOATING REST / ACTIVE TIMER BAR */
    .floating-timer {
      position: fixed;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 456px;
      background: rgba(26, 29, 36, 0.97);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 10px 13px;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 25px rgba(0,0,0,0.75);
    }

    .floating-timer.active {
      display: flex;
    }

    .ft-time {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .ft-label {
      font-size: 11px;
      color: var(--muted);
      max-width: 190px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* GUIDED RUN TIMER BOX */
    .run-console {
      background: var(--s2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
    }

    .run-clock {
      font-family: var(--font-head);
      font-size: 38px;
      font-weight: 700;
      color: var(--cyan);
      text-align: center;
      letter-spacing: 1px;
      line-height: 1.05;
      margin: 6px 0;
    }

    .run-step-list {
      max-height: 190px;
      overflow-y: auto;
      margin-top: 9px;
      border-top: 1px solid var(--border);
      padding-top: 7px;
    }

    .run-step-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .run-step-item.current {
      background: var(--cyan-dim);
      color: var(--text);
      font-weight: 600;
      border-left: 3px solid var(--cyan);
    }

    .run-step-item.done {
      opacity: 0.45;
      text-decoration: line-through;
    }

    /* TABLES */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 6px;
    }

    table.af-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    table.af-table th, table.af-table td {
      border: 1px solid var(--border);
      padding: 7px 6px;
      text-align: left;
    }

    table.af-table th {
      background: var(--s2);
      color: var(--gold);
      font-family: var(--font-head);
      font-size: 12.5px;
      font-weight: 700;
    }

    table.af-table td input {
      width: 100%;
      min-width: 48px;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 4px 5px;
      font-family: var(--font-head);
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(18, 20, 26, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 55;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--muted);
      padding: 9px 4px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: 0.15s;
    }

    .nav-item .nav-ico {
      font-size: 17px;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--gold);
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <!-- Preloaded Headset Media Stream Audio Element -->
    <audio id="headset-chime" preload="auto"></audio>

    <!-- Sticky Header -->
    <header class="top-bar">
      <div class="top-row-1">
        <div>
          <div class="brand-title">⚡ AEROFRAME V1.0</div>
          <span class="brand-sub">Endurance & Aesthetic Hybrid • 53→55 kg</span>
        </div>
        <button id="btn-audio-unlock" class="btn-audio-test" onclick="unlockHeadsetAudio(true)">
          🔊 Tes Suara Headset
        </button>
      </div>
      <div class="top-row-2">
        <select id="phase-selector" class="phase-select" onchange="changePhase(this.value)">
          <option value="0">W0: Pekan Adaptasi (20–25 Okt 2026)</option>
          <option value="1">W1: Fase Inti Gym Pekan 1 (26 Okt–1 Nov)</option>
          <option value="2">W2: Fase Inti Gym Pekan 2 (2–8 Nov)</option>
          <option value="3">W3: Fase Inti Gym Pekan 3 (9–15 Nov)</option>
          <option value="4">W4: Fase Inti Gym Pekan 4 + Tes Pace-HR (16–22 Nov)</option>
          <option value="5">W5: Fase Inti Gym Pekan 5 / Opsi Deload (23–29 Nov)</option>
          <option value="6">W6: Fase Inti Gym Pekan 6 (30 Nov–6 Des)</option>
          <option value="7">W7: Fase Inti Gym Pekan 7 + Adaptasi Aspal (7–13 Des)</option>
          <option value="8">W8: Fase Inti Gym Pekan 8 + Tes Akhir (14–19 Des)</option>
          <option value="9">W9: Transisi Kalistenik & Outdoor (20 Des 26–22 Feb 27)</option>
        </select>
        <span id="header-readiness-pill" class="badge-pill badge-green">🟢 HIJAU</span>
      </div>
    </header>

    <!-- Dynamic Tab Container -->
    <main id="app-content" class="main-view"></main>

    <!-- Floating Background-Resilient Rest & Active Timer -->
    <div id="floating-timer" class="floating-timer">
      <div>
        <div id="ft-label" class="ft-label">Timer Istirahat</div>
        <div id="ft-time" class="ft-time">00:00</div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn" onclick="adjustTimer(-15)">-15s</button>
        <button class="btn" onclick="adjustTimer(15)">+15s</button>
        <button class="btn btn-red" onclick="stopFloatingTimer()">✕ Stop</button>
      </div>
    </div>

    <!-- 4 Bottom Navigation Tabs -->
    <nav class="bottom-nav">
      <button id="nav-workout" class="nav-item active" onclick="switchTab('workout')">
        <span class="nav-ico">🏃</span>
        <span>Latihan</span>
      </button>
      <button id="nav-progress" class="nav-item" onclick="switchTab('progress')">
        <span class="nav-ico">📈</span>
        <span>Progress</span>
      </button>
      <button id="nav-log" class="nav-item" onclick="switchTab('log')">
        <span class="nav-ico">🗓️</span>
        <span>Log</span>
      </button>
      <button id="nav-insight" class="nav-item" onclick="switchTab('insight')">
        <span class="nav-ico">📖</span>
        <span>Insight</span>
      </button>
    </nav>
  </div>

  <script>
    /* =========================================================================
       1. CORE CONSTANTS, STATE MANAGEMENT & LOCALSTORAGE ENGINE
       ========================================================================= */
    const STORAGE_KEY = 'aeroframe_v10_state';
    const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const DAY_LABELS = {
      mon: { short: 'SEN', full: 'Senin', tag: 'Neck' },
      tue: { short: 'SEL', full: 'Selasa', tag: 'Upper A' },
      wed: { short: 'RAB', full: 'Rabu', tag: 'Lower+Z2' },
      thu: { short: 'KAM', full: 'Kamis', tag: 'DOMS/Neck' },
      fri: { short: 'JUM', full: 'Jumat', tag: 'Tempo Z3' },
      sat: { short: 'SAB', full: 'Sabtu', tag: 'Upper B' },
      sun: { short: 'AHD', full: 'Ahad', tag: 'Long Z2' }
    };

    /* =========================================================================
       2. DUAL-STREAM HEADSET AUDIO ENGINE & WAKE LOCK
       ========================================================================= */
    let audioCtx = null;
    let wakeLockSentinel = null;

    // Generate valid 16-bit PCM 44.1kHz WAV Data URI (3-pulse 880Hz/1320Hz chime)
    function buildHeadsetChimeDataURI() {
      const sampleRate = 44100;
      const durationSec = 0.65;
      const numSamples = Math.floor(sampleRate * durationSec);
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, numSamples * 2, true);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        let sample = 0;
        // 3 distinct pulses: 0-0.14s (880Hz), 0.18-0.32s (880Hz), 0.36-0.62s (1320Hz)
        if (t < 0.14) {
          sample = Math.sin(2 * Math.PI * 880 * t) * Math.exp(-t * 8);
        } else if (t >= 0.18 && t < 0.32) {
          const dt = t - 0.18;
          sample = Math.sin(2 * Math.PI * 880 * dt) * Math.exp(-dt * 8);
        } else if (t >= 0.36 && t < 0.64) {
          const dt = t - 0.36;
          sample = Math.sin(2 * Math.PI * 1320 * dt) * Math.exp(-dt * 5);
        }
        const pcmVal = Math.max(-1, Math.min(1, sample * 0.85));
        view.setInt16(44 + i * 2, pcmVal < 0 ? pcmVal * 0x8000 : pcmVal * 0x7FFF, true);
      }

      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    function initHeadsetAudioElement() {
      const el = document.getElementById('headset-chime');
      if (el && !el.src) {
        el.src = buildHeadsetChimeDataURI();
        el.volume = 1.0;
      }
    }

async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
          console.log('Screen Wake Lock aktif.');
        }
      } catch (err) {
        console.warn('Wake Lock gagal / tidak didukung:', err);
      }
    }

    function armWakeLockOnFirstTouch() {
      const activate = () => {
        requestScreenWakeLock();
        if (!ST.audioUnlocked) {
          unlockHeadsetAudio(false);
        }
        window.removeEventListener('click', activate);
        window.removeEventListener('touchstart', activate);
      };
      window.addEventListener('click', activate, { once: true });
      window.addEventListener('touchstart', activate, { once: true });
    }

    function unlockHeadsetAudio(playDemo = false) {
      initHeadsetAudioElement();
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const el = document.getElementById('headset-chime');
      if (el) {
        el.currentTime = 0;
        const p = el.play();
        if (p !== undefined) {
          p.then(() => {
            if (!playDemo) {
              el.pause();
              el.currentTime = 0;
            }
          }).catch(() => {});
        }
      }
      if (playDemo) {
        playWebAudioBeep(880, 0.12);
        setTimeout(() => playWebAudioBeep(1320, 0.22), 160);
        if (navigator.vibrate) navigator.vibrate([150, 80, 200]);
      }
      ST.audioUnlocked = true;
      const btn = document.getElementById('btn-audio-unlock');
      if (btn) {
        btn.classList.add('unlocked');
        btn.innerHTML = '🔊 Headset Aktif ✓';
      }
      requestScreenWakeLock();
    }

    function playWebAudioBeep(freq = 660, dur = 0.12) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function triggerCompletionAlarm() {
      // 1. Media/Headset Stream via <audio> WAV
      const el = document.getElementById('headset-chime');
      if (el) {
        el.currentTime = 0;
        el.play().catch(() => {});
      }
      // 2. Web Audio API dual-frequency chime
      playWebAudioBeep(880, 0.16);
      setTimeout(() => playWebAudioBeep(1320, 0.30), 180);
      // 3. Tactile vibration
      if (navigator.vibrate) {
        navigator.vibrate([250, 100, 250, 100, 400]);
      }
    }

    function getDayExercises(dayKey) {
      const p = Number(ST.phase);
      const schedType = getEffectiveScheduleType(dayKey);

      if (dayKey === 'mon' || dayKey === 'thu') {
        return getPosturalNeckExercises();
      }
      if (schedType === 'upper_a' || schedType === 'upper_a_plus_run1') {
        return getUpperAExercises(p);
      }
      if (schedType === 'lower_plus_run1' || schedType === 'lower_only') {
        return getLowerExercises(p);
      }
      if (dayKey === 'sat') {
        return getUpperBExercises(p);
      }
      return [];
    }
  /* =========================================================================
       5. READINESS ENGINE (7-DAY ROLLING RHR) & DOMS GATE EVALUATOR
       ========================================================================= */
    function getRollingRhrBaseline() {
      const vals = [];
      Object.keys(ST.readinessLog).forEach(k => {
        const entry = ST.readinessLog[k];
        if (entry && entry.rhr && !isNaN(Number(entry.rhr)) && Number(entry.rhr) >= 35 && Number(entry.rhr) <= 110) {
          vals.push(Number(entry.rhr));
        }
      });
      if (vals.length === 0) return 53;
      const recent = vals.slice(-7);
      const sum = recent.reduce((a, b) => a + b, 0);
      return Math.round(sum / recent.length);
    }

    function getCurrentReadiness(p = ST.phase, d = ST.day) {
      const key = `w${p}_${d}`;
      const rec = ST.readinessLog[key] || { rhr: '', sleep: '', feel: 'fresh' };
      const base = getRollingRhrBaseline();
      const rhr = rec.rhr !== '' ? Number(rec.rhr) : base;
      const sleep = rec.sleep !== '' ? Number(rec.sleep) : 7.0;
      const feel = rec.feel || 'fresh';

      let mode = 'green';
      if (sleep < 5.0 || rhr >= base + 7 || rhr >= 60 || feel === 'sick') {
        mode = 'red';
      } else if ((sleep >= 5.0 && sleep < 6.5) || (rhr >= base + 5 && rhr <= base + 6) || feel === 'tired') {
        mode = 'yellow';
      }
      return { mode, rhr: rec.rhr, sleep: rec.sleep, feel, base };
    }

    function getDomsStatus(p = ST.phase) {
      const rec = ST.domsLog['w' + p] || { score: 2, hrDrift: false };
      const score = Number(rec.score ?? 2);
      const hrDrift = Boolean(rec.hrDrift);

      let gate = 'green';
      if (score >= 6) {
        gate = 'red';
      } else if (score >= 4 || hrDrift) {
        gate = 'yellow';
      }
      return { gate, score, hrDrift };
    }

        const queue = isW0
