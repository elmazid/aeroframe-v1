      } else if (r.mode === 'yellow') {
        pill.classList.add('badge-ora');
        pill.textContent = '🟡 KUNING';
      } else {
        pill.classList.add('badge-red');
        pill.textContent = '🔴 MERAH';
      }
    }

    // Kartu Sesi Lari (dipakai di posisi berbeda: Selasa V3.0 = sebelum Lower)
    function renderRunCardHtml(runSession, p, d) {
      const runDoneKey = `w${p}_${d}_run_done`;
      const isRunDone = Boolean(ST.setsDone[runDoneKey]);
      const showGuidedConsole = Boolean(runSession.queue && runSession.queue.length > 0);

      let consoleHtml = '';
      if (showGuidedConsole) {
        const isCurrentRun = (runTimerState.dayKey === d && runTimerState.phase === p);
        const curStepIdx = isCurrentRun ? Math.min(runTimerState.stepIdx, runSession.queue.length - 1) : 0;
        const curStep = runSession.queue[curStepIdx] || runSession.queue[0];

        const initClockText = isCurrentRun
          ? (runTimerState.active
              ? (runTimerState.prepMode
                  ? `SIAP ${Math.max(1, Math.ceil((runTimerState.prepEndTime - Date.now()) / 1000))}`
                  : formatMMSS(Math.max(0, Math.ceil((runTimerState.targetEndTime - Date.now()) / 1000))))
              : (runTimerState.paused ? formatMMSS(runTimerState.remainingSecOnPause) : formatMMSS(curStep.sec)))
          : formatMMSS(curStep.sec);

        consoleHtml = `
          <div class="run-console">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="badge-pill badge-gold">Segmen ${curStepIdx + 1}/${runSession.queue.length}</span>
              <span style="font-size:11px; color:var(--muted);">Headset Chime & WakeLock Aktif</span>
            </div>
            <div style="text-align:center; margin-top:6px; font-weight:700; font-size:13.5px; color:var(--text);">
              ${curStep.label}
            </div>
            <div style="text-align:center; font-size:11.5px; color:var(--muted); margin-bottom:4px;">
              ${curStep.desc}
            </div>

            <div id="guided-run-clock" class="run-clock">${initClockText}</div>

            <div class="action-row" style="justify-content:center;">
              <button class="btn" onclick="skipGuidedRunStep(-1)">⏮️ Prev</button>
              ${runTimerState.active && isCurrentRun ? `
                <button class="btn btn-gold" onclick="pauseGuidedRun()">⏸️ Pause</button>
              ` : `
                <button class="btn btn-green" onclick="startGuidedRun()">▶️ Mulai / Lanjut</button>
              `}
              <button class="btn" onclick="skipGuidedRunStep(1)">⏭️ Next</button>
              <button class="btn btn-red" onclick="resetGuidedRun()">↺ Reset</button>
            </div>

            <div class="run-step-list">
              ${runSession.queue.map((st, idx) => `
                <div class="run-step-item ${idx === curStepIdx ? 'current' : (idx < curStepIdx ? 'done' : '')}">
                  <span>${idx + 1}. ${st.label}</span>
                  <b>${formatMMSS(st.sec)}</b>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      const metricValue = (m) => {
        if (m.noCarry) {
          if (m.key === 'test_hr_60') {
            const t = getTestHrValue(p);
            return t !== null ? t : '';
          }
          const v = getStoredMetric(p, m.key);
          return v !== null ? v : '';
        }
        return getMetricVal(m.key, m.def);
      };

      return `
        <div class="section-label">
          <span>🏃 PANDUAN SESI LARI & INTERVAL</span>
          <span>${runSession.hrZoneBadge}</span>
        </div>

        <div class="card ${isRunDone ? 'card-green' : (runSession.isTestWeek ? 'card-gold' : 'card-cyan')}">
          <div class="card-header">
            <div class="card-title">${runSession.title}</div>
            <span class="badge-pill badge-cyan">${runSession.targetBadge}</span>
          </div>

          <div class="warn-banner">${runSession.warning}</div>

          ${consoleHtml}

          <div class="grid-2" style="margin:10px 0;">
            ${runSession.metrics.map(m => `
              <div class="field-box">
                <label>${m.label}</label>
                ${m.isText ? `
                  <input type="text" inputmode="text" placeholder="${m.placeholder || 'mm:ss'}"
                    value="${metricValue(m)}"
                    onchange="updateMetric('${m.key}', this.value)" />
                ` : `
                  <input type="number" step="0.01" placeholder="${m.placeholder || ''}"
                    value="${metricValue(m)}"
                    onchange="updateMetric('${m.key}', this.value)" />
                `}
              </div>
            `).join('')}
          </div>

          ${runSession.guide ? `
            <div class="action-row" style="margin-top:0; margin-bottom:8px;">
              <button class="btn" onclick="toggleAccordion('info-${runSession.id}')">📖 Panduan Lari</button>
            </div>
            <div id="info-${runSession.id}" class="info-box" style="margin-bottom:8px;">${runSession.guide}</div>
          ` : ''}

          <button class="set-btn ${isRunDone ? 'completed' : ''}" style="width:100%;" onclick="toggleRunComplete()">
            ${isRunDone ? '✓ Sesi Lari Selesai & Tersimpan' : '○ Tandai Sesi Lari Selesai'}
          </button>
        </div>
      `;
    }

    function renderWarmupAccordionHtml(accId, title, steps, p, d) {
      return `
        <button class="acc-header" onclick="toggleAccordion('${accId}')">
          <span>${title}</span>
          <span style="color:var(--gold);">▼</span>
        </button>
        <div id="${accId}" class="acc-body open">
          ${steps.map((w, idx) => `
            <div style="padding:7px 0; border-bottom:${idx < steps.length - 1 ? '1px solid var(--border)' : 'none'};">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                <strong style="font-size:12.5px;">${w.title}</strong>
                <span class="badge-pill badge-gold">${w.badge}</span>
              </div>
              <div style="font-size:11.5px; color:var(--muted); margin-top:3px; white-space:pre-line;">${w.info}</div>${w.checklist ? `
                <div class="r7-list">
                  ${w.checklist.map((item, i) => {
                    const done = Boolean(ST.setsDone[`w${p}_${d}_r7_${i}`]);
                    return `<button class="r7-item ${done ? 'done' : ''}" onclick="toggleRutinItem(${i})"><span class="r7-mark">${done ? '✓' : (i + 1) + '.'}</span><span>${item}</span></button>`;
                  }).join('')}
                </div>
              ` : ''}${w.timerSec > 0 ? `
                <button class="btn btn-cyan" style="margin-top:6px; padding:5px 9px;"
                  onclick="startFloatingTimer(${w.timerSec}, '${w.title.replace(/'/g, '')}', true)">
                  ⏱️ Timer ${w.timerSec} dtk
                </button>
              ` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderWorkoutTab() {
      const p = Number(ST.phase);
      const d = ST.day;
      const readiness = getCurrentReadiness(p, d);
      const doms = getDomsStatus(p);
      const schedType = getEffectiveScheduleType(d);
      const returnActive = isReturnWeek(p);

      let html = '';

      // 1. DAY SELECTOR BAR (MON - SUN)
      html += `<div class="day-bar">`;
      DAYS.forEach(k => {
        const lbl = DAY_LABELS[k];
        let tagText = lbl.tag;
        if (k === 'fri' && p === MAX_PHASE) tagText = 'Tes HR';
        const isCoreMvw = (k === 'wed' || k === 'sat' || k === 'sun');
        if (ST.mvw && !isCoreMvw) tagText = 'Opsional';

        const activeCls = (k === d) ? 'active' : '';
        const doneCls = isDayCompleted(p, k) ? 'done-day' : '';
        html += `
          <div class="day-btn ${activeCls} ${doneCls}" onclick="selectDay('${k}')">
            <span class="d-name">${lbl.short}</span>
            <span class="d-tag">${tagText}</span>
          </div>
        `;
      });
      html += `</div>`;

      // 2. SAKLAR KESIAPAN PAGI (7-DAY ROLLING RHR BASELINE)
      const rCardCls = readiness.mode === 'green'
        ? 'card-green'
        : (readiness.mode === 'yellow' ? 'card-ora' : 'card-red');
      const rBadgeText = readiness.mode === 'green'
        ? '🟢 HIJAU — EKSEKUSI PENUH'
        : (readiness.mode === 'yellow' ? '🟡 KUNING — AUTO-REGULASI' : '🔴 MERAH — STOP LATIHAN');

      html += `
        <div class="card ${rCardCls}">
          <div class="card-header">
            <div>
              <div class="card-title">Saklar Kesiapan Pagi (${DAY_LABELS[d].full})</div>
              <div style="font-size:11px; color:var(--muted);">
                Baseline RHR 7-Hari: <b>${readiness.base} bpm</b> • HRmax: <b>193 bpm</b>
              </div>
            </div>
            <span class="badge-pill ${readiness.mode === 'green' ? 'badge-green' : (readiness.mode === 'yellow' ? 'badge-ora' : 'badge-red')}">
              ${rBadgeText}
            </span>
          </div>

          <div class="grid-3">
            <div class="field-box">
              <label>RHR Pagi (bpm)</label>
              <input type="number" placeholder="${readiness.base}" value="${readiness.rhr}"
                onchange="updateReadinessField('rhr', this.value)" />
            </div>
            <div class="field-box">
              <label>Jam Tidur (jam)</label>
              <input type="number" step="0.5" placeholder="7.0" value="${readiness.sleep}"
                onchange="updateReadinessField('sleep', this.value)" />
            </div>
            <div class="field-box">
              <label>Kondisi Tubuh</label>
              <select onchange="updateReadinessField('feel', this.value)">
                <option value="fresh" ${readiness.feel === 'fresh' ? 'selected' : ''}>Segar</option>
                <option value="tired" ${readiness.feel === 'tired' ? 'selected' : ''}>Lemas/Pegal/Kurang Tidur</option>
                <option value="sick" ${readiness.feel === 'sick' ? 'selected' : ''}>Demam/Sakit/Pusing</option>
              </select>
            </div>
          </div>

          ${readiness.rhrWatch ? `
            <div style="margin-top:8px; font-size:11.5px; color:var(--muted);">
              👀 RHR +5 s.d. +6 bpm di satu pagi tanpa tanda lain: jalankan sesi seperti biasa, catat, lalu cek pagi berikutnya (Kuning hanya bila bertahan dua pagi berturut-turut).
            </div>
          ` : ''}

          ${readiness.mode === 'yellow' ? `
            <div class="warn-banner" style="margin-top:9px; margin-bottom:0;">
              ⚡ <b>Mode Kuning:</b> <b>Opsi 1</b> — geser latihan ke sore setelah tidur siang ≤ 20 menit (sebelum 15:00). <b>Opsi 2</b> — potong 1 set kerja di semua gerakan gym (saklar di bawah). <b>Jumat:</b> Tempo otomatis diganti <b>Easy Run Z2 25–30 mnt</b>.
            </div>
            <div class="toggle-row" onclick="toggleStateFlag('yellowCutSet')">
              <span>⚡ Opsi 2: Potong -1 Set Kerja Gerakan Gym (Set 0 Tetap Ada)</span>
              <div class="switch-pill ${ST.yellowCutSet ? 'on' : ''}"></div>
            </div>
          ` : ''}

          ${readiness.mode === 'red' ? `
            <div class="danger-banner" style="margin-top:9px; margin-bottom:0;">
              🛑 STOP: Batalkan gym, lari, dan renang! Ganti dengan tidur pemulihan atau jalan santai. Bila penyebabnya nyeri dada, sesak tak wajar, atau berdebar kacau → JANGAN jalan, ikuti aturan henti: hentikan total, minta bantuan; bila tidak reda/menjalar/pingsan → segera ke UGD!
            </div>
          ` : ''}

          <!-- Mode Switches -->
          <div class="toggle-row" onclick="toggleStateFlag('mvw')">
            <span>🛡️ Mode MVW / Pekan Ujian (Inti: Rabu, Sabtu & Ahad)</span>
            <div class="switch-pill ${ST.mvw ? 'on' : ''}"></div>
          </div>

          ${p === 5 ? `
            <div class="toggle-row" onclick="toggleStateFlag('w5Deload')">
              <span>🌿 Mode Deload Pekan 5 (Gym 2 Set Kerja, Jumat Easy Z2 25m, Ahad 45m)</span>
              <div class="switch-pill ${ST.w5Deload ? 'on' : ''}"></div>
            </div>
          ` : ''}

          ${p >= 1 ? `
            <div class="toggle-row" onclick="toggleReturnMode()">
              <span>🔁 Mode Mulai/Kembali (Baru Mulai / Absen > 2 Pekan) — Pekan Ini</span>
              <div class="switch-pill ${returnActive ? 'on' : ''}"></div>
            </div>
          ` : ''}

          ${returnActive ? `
            <div class="warn-banner" style="margin-top:8px; margin-bottom:0;">
              🔁 <b>Protokol Mulai/Kembali aktif (W${p} saja):</b> 2 set kerja per gerakan (Set 0 tetap), RIR 3–4, tanpa memperlambat fase turun berlebihan; Lari 1 tanpa strides; Tempo 3 × 3 mnt; Long Run 35 mnt. Mulai dari beban kolom <b>Awal (W0)</b>; naik satu tahap hanya setelah 2–3 sesi di beban sama dengan teknik stabil & DOMS ≤ 3.
            </div>
          ` : ''}
        </div>
      `;

      // MVW Status Banner
      if (ST.mvw) {
        const isCore = (d === 'wed' || d === 'sat' || d === 'sun');
        html += `
          <div class="card ${isCore ? 'card-gold' : ''}" style="padding:10px 12px;">
            <span class="badge-pill ${isCore ? 'badge-gold' : 'badge-cyan'}">
              ${isCore ? '⭐ SESI INTI (MVW)' : '💤 OPSIONAL (MVW)'}
            </span>
            <span style="font-size:11.5px; margin-left:6px; color:var(--muted);">
              ${isCore ? 'Wajib dipertahankan saat pekan sibuk/ujian.' : 'Boleh dilewati untuk fokus pemulihan & akademik.'}
            </span>
          </div>
        `;
      }

      // 2B. GERBANG DOMS KAMIS LALU -> LOWER SELASA INI (V3.0, OTOMATIS)
      if (d === 'tue' && isV3(p)) {
        const tg = getTuesdayDomsGate(p);
        const lw = getLowerExercises(p);
        const setsOf = id => { const e = lw.find(x => x.id === id); return e ? e.sets : 0; };
        const tgCls = tg.gate === 'green' ? 'card-green' : (tg.gate === 'yellow' ? 'card-ora' : 'card-red');
        const tgBadge = tg.gate === 'green' ? 'badge-green' : (tg.gate === 'yellow' ? 'badge-ora' : 'badge-red');
        let tgText = '';
        if (isStartMode(p)) {
          tgText = '🔁 Mode Mulai/Kembali: RDL 2 set, tanpa pogo hops.';
        } else if (tg.gate === 'green') {
          tgText = `✅ RDL <b>${setsOf('lw_1')} set</b> (naik ke 3 set diizinkan)${p >= 4 ? ' · Pogo hops <b>aktif</b>' : ''}.`;
        } else if (tg.gate === 'yellow') {
          tgText = `⚠️ Skor 4–5: RDL & Calf Raise dikurangi 1 set hari ini (RDL <b>${setsOf('lw_1')}</b>, Calf <b>${setsOf('lw_4')}</b> set)${p >= 4 ? '; pogo hops ditunda' : ''}.`;
        } else {
          tgText = '🛑 Skor ≥ 6: volume Lower hari ini dipangkas 50% (jumlah set di kartu sudah disesuaikan); pogo hops ditunda.';
        }
        html += `
          <div class="card ${tgCls}" style="padding:10px 12px;">
            <span class="badge-pill ${tgBadge}">🦵 Gerbang DOMS Kamis Lalu (W${tg.fromWeek}): ${tg.score}/10${tg.logged ? '' : ' (belum dicatat → default)'}</span>
            <div style="font-size:11.5px; margin-top:6px; color:var(--text);">${tgText}</div>
          </div>
        `;
      }

      // 3. GERBANG DOMS KAMIS & SAKLAR HR DRIFT JUMAT
      if (d === 'thu' || d === 'fri') {
        const domsCls = doms.gate === 'green' ? 'card-green' : (doms.gate === 'yellow' ? 'card-ora' : 'card-red');
        const domsBadge = doms.gate === 'green'
          ? '🟢 HIJAU (LOLOS)'
          : (doms.gate === 'yellow' ? '🟡 KUNING (MODIFIKASI)' : '🔴 MERAH (PROTEKSI)');
        const prevSun = getPrevSundayAnchor(p);
        const friAnchorRaw = getStoredMetric(p, 'run2_anchor_hr');
        const friAnchor = (friAnchorRaw !== null && !isNaN(Number(friAnchorRaw))) ? Number(friAnchorRaw) : null;
        const driftDelta = (prevSun !== null && friAnchor !== null) ? (friAnchor - prevSun) : null;

        html += `
          <div class="card ${domsCls}">
            <div class="card-header">
              <div>
                <div class="card-title">🦵 Gerbang DOMS Kamis & ⚓ Saklar HR Drift Jumat</div>
                <div style="font-size:11px; color:var(--muted);">Aturan praktis dari data sendiri (bukan ambang klinis) — baca trennya beberapa pekan</div>
              </div>
              <span class="badge-pill ${doms.gate === 'green' ? 'badge-green' : (doms.gate === 'yellow' ? 'badge-ora' : 'badge-red')}">${domsBadge}</span>
            </div>

            <div class="field-box" style="margin-bottom:8px;">
              <label>Skor Pegal Hamstring/Betis Saat Turun Tangga (0–10): <b>${doms.score}/10</b></label>
              <input type="range" min="0" max="10" step="1" value="${doms.score}"
                onchange="updateDomsField('score', Number(this.value))" />
            </div>

            <div style="font-size:11.5px; color:var(--muted); margin-bottom:2px;">
              ⚓ HR Jangkar Ahad lalu (W${Math.max(0, p - 1)}): <b>${prevSun !== null ? prevSun + ' bpm' : 'belum dicatat'}</b>${prevSun !== null ? ` → batas drift <b>≥ ${prevSun + 8} bpm</b>` : ''}${friAnchor !== null ? ` • Jumat ini: <b>${friAnchor} bpm</b>${driftDelta !== null ? ` (${driftDelta > 0 ? '+' : ''}${driftDelta})` : ''}` : ''}
            </div>

            <div class="toggle-row" onclick="updateDomsField('hrDrift', !${doms.hrDrift})">
              <span>📈 HR Jangkar menit ke-4 Jumat ≥ +8 bpm dari Ahad lalu? (otomatis dari kotak HR Jangkar Jumat; bisa diubah manual)</span>
              <div class="switch-pill ${doms.hrDrift ? 'on' : ''}"></div>
            </div>

            <div style="margin-top:8px; font-size:11.5px; color:var(--text);">
              ${doms.gate === 'green'
                ? '✅ <b>Status LOLOS:</b> Tempo Jumat normal; kenaikan RDL 2 → 3 set (W3+) dan pogo hops (W4+) diizinkan untuk Selasa depan.'
                : (doms.gate === 'yellow'
                    ? '⚠️ <b>Status MODIFIKASI:</b> Jumat diganti <b>Easy Run Z2 konstan 25–30 mnt</b>; Selasa depan otomatis dikurangi 1 set RDL & 1 set Calf Raise.'
                    : '🛑 <b>Status PROTEKSI:</b> Jumat diganti <b>jalan santai 20–25 mnt (HR < 130 bpm)</b> atau istirahat penuh; volume Lower Selasa depan otomatis dipangkas 50%.')}
              ${doms.hrDrift ? '<br>📈 <b>HR Drift aktif:</b> Tempo Jumat diganti Easy Run Z2 25 mnt (tidak memengaruhi volume Lower).' : ''}
            </div>
          </div>
        `;
      }

      // 3B. SELASA: LARI 1 DIKERJAKAN SEBELUM LOWER (W3+). V4.0: Rutin 7 Gerakan -> Lari 1 -> Transisi -> Lower
      const runSession = getRunSessionForDay(d, p);
      const runFirst = Boolean(runSession && d === 'tue' && isRunFirstTuesday(p));
      const wcData = getWarmupCooldownData(d);
      const warmupBeforeRun = Boolean(runFirst && isV4(p));

      // 4. CONTEXT-AWARE WARM-UP ACCORDION (withPrep = true)
      if (warmupBeforeRun && wcData && wcData.warmup) {
        html += renderWarmupAccordionHtml('acc-warmup', wcData.warmupTitle, wcData.warmup, p, d);
      }
      if (runSession && runFirst) {
        html += renderRunCardHtml(runSession, p, d);
      }
      if (!warmupBeforeRun && wcData && wcData.warmup) {
        html += renderWarmupAccordionHtml('acc-warmup', wcData.warmupTitle, wcData.warmup, p, d);
      }
      if (wcData && wcData.transition && wcData.transition.length) {
        html += renderWarmupAccordionHtml('acc-transition', wcData.transitionTitle, wcData.transition, p, d);
      }

      // 5. EXERCISE CARDS FOR CURRENT DAY (HEVY-STYLE PER-SET INPUTS + SET 0 WARM-UP)
      const exercises = getDayExercises(d);
      if (exercises.length > 0) {
        const dayHeaderTitle = (d === 'mon' || d === 'thu')
          ? '🧘 MODUL POSTUR & PREHAB ENGKEL 3 ARAH (±11 Menit, Kamar)'
          : (schedType.includes('upper_a')
              ? (isV4(p) ? '🏋️ GYM UPPER A (±53 Mnt) — Dada Atas, Pulldown, Bahu & Lengan' : '🏋️ GYM UPPER A (±50 Mnt) — Dada Atas, Pulldown, Bahu & Lengan')
              : (schedType.includes('lower')
                  ? (isV4(p) ? '🦵 GYM LOWER (±37 Mnt, Setelah Lari 1) — RDL, Betis & Suitcase Carry' : '🦵 GYM 2 — LOWER (Olympic Barbell RDL, Betis & Kapasitas Angkat)')
                  : (isV4Day(p, 'sat') ? '🏋️ GYM UPPER B (±55 Mnt) — Assisted Pull-Up, Carry Depan & Lengan' : p >= V3_UPPER_B_START_PHASE ? '🏋️ GYM UPPER B (±48 Mnt) — Assisted Pull-Up, Punggung Tengah & Lengan' : '🏋️ GYM 3 — UPPER B (Anti-Slouch, Back Density & Forearm #2)')));

        html += `<div class="section-label"><span>${dayHeaderTitle}</span><span>${PHASE_NAMES[p].split(':')[0]}</span></div>`;

        exercises.forEach(ex => {
          let effSets = ex.sets;
          // Protokol Mulai/Kembali: maksimal 2 set kerja per gerakan gym (Set 0 tetap)
          if (returnActive && d !== 'mon' && d !== 'thu' && effSets > 2) {
            effSets = 2;
          }
          // Deload W5 & Yellow Mode only cut working sets, never removing Set 0 (WU)
          if (p === 5 && ST.w5Deload && effSets === 3) {
            effSets = 2;
          }
          if (readiness.mode === 'yellow' && ST.yellowCutSet && d !== 'mon' && d !== 'thu') {
            effSets = Math.max(1, effSets - 1);
          }

          let allSetsDone = true;
          const hasPerSetMetrics = Boolean(ex.metrics && ex.metrics.length > 0);
          let setsBlockHtml = '';

          if (hasPerSetMetrics) {
            const m0 = ex.metrics[0];
            const m1 = ex.metrics[1] || null;

            setsBlockHtml += `<div class="hevy-sets-wrap">`;
            setsBlockHtml += `
              <div class="hevy-header">
                <span>SET</span>
                <span>${m0.label}</span>
                <span>${m1 ? m1.label : ''}</span>
              </div>
            `;

            // Render Set 0 (Warm-Up) row at the very top of .hevy-sets-wrap if defined
            // V4.0: set pemanasan kedua (set ramp RDL) disimpan di _sw1, tanpa mewarisi nilai pekan lalu
            [ex.warmupSet, ex.rampSet].forEach((wu, wuIdx) => {
              if (!wu) return;
              const wuDoneKey = `w${p}_${d}_${ex.id}_sw${wuIdx}`;
              const isWuDone = Boolean(ST.setsDone[wuDoneKey]);
              const storedWu = key => {
                const v = ST.metrics[`w${p}_${key}_sw${wuIdx}`];
                return (v !== undefined && v !== '') ? v : null;
              };
              const wuVal0 = wuIdx === 0 ? getWarmupMetricVal(m0.key, wu.defKg) : (storedWu(m0.key) ?? wu.defKg);
              const wuVal1 = m1 ? (wuIdx === 0 ? getWarmupMetricVal(m1.key, wu.defReps) : (storedWu(m1.key) ?? wu.defReps)) : '';
              const wuTag = wuIdx === 0 ? 'WU' : 'Ramp';
              const wuArg = wuIdx === 0 ? '' : `, ${wuIdx}`;

              setsBlockHtml += `
                <div class="hevy-set-row warmup-row ${isWuDone ? 'done' : ''}">
                  <button class="set-btn ${isWuDone ? 'completed' : ''}"
                    onclick="toggleWarmupSet('${ex.id}', ${wu.restSec || 40}${wuArg})">
                    ${isWuDone ? '✓' : '○'} ${wuIdx === 0 ? 'Set 0 (WU)' : 'Set 0 Ramp'}
                  </button>
                  <div class="hevy-input-box">
                    <span>${wuTag} ${m0.label}</span>
                    <input type="number" step="0.5" value="${wuVal0}"
                      onchange="updateWarmupMetric('${m0.key}', this.value${wuArg})" />
                  </div>
                  ${m1 ? `
                    <div class="hevy-input-box">
                      <span>${wuTag} ${m1.label}</span>
                      <input type="number" step="0.5" value="${wuVal1}"
                        onchange="updateWarmupMetric('${m1.key}', this.value${wuArg})" />
                    </div>
                  ` : `<div></div>`}
                  <div class="hevy-warmup-note">${wu.note}</div>
                </div>
              `;
            });

            // Render Working Sets (Set 1, Set 2, Set 3 -> stored at _s0, _s1, _s2)
            for (let s = 0; s < effSets; s++) {
              const sKey = `w${p}_${d}_${ex.id}_s${s}`;
              const isDone = Boolean(ST.setsDone[sKey]);
              if (!isDone) allSetsDone = false;

              let btnLbl = `Set ${s + 1}`;
              if (ex.id === 'ub_6b') {
                btnLbl = s < 2 ? `Wrist ${s + 1}` : `Hang 1`;
              }
              // V3.0: set terakhir Calf Raise dengan lutut menekuk (soleus)
              if (ex.lastSetLabel && effSets > 1 && s === effSets - 1) {
                btnLbl = `Set ${s + 1} ${ex.lastSetLabel}`;
              }

              const def0 = (m0.defSets && m0.defSets[s] !== undefined) ? m0.defSets[s] : m0.def;
              const val0 = getSetMetricVal(m0.key, s, def0);

              let col2Html = '';
              if (m1) {
                const def1 = (m1.defSets && m1.defSets[s] !== undefined) ? m1.defSets[s] : m1.def;
                const val1 = getSetMetricVal(m1.key, s, def1);
                let subLbl1 = m1.label;
                if (ex.id === 'ub_6b') {
                  subLbl1 = s < 2 ? 'Wrist Rep' : 'Hang (dtk)';
                }
                col2Html = `
                  <div class="hevy-input-box">
                    <span>${subLbl1}</span>
                    <input type="number" step="0.5" value="${val1}"
                      onchange="updateSetMetric('${m1.key}', ${s}, this.value)" />
                  </div>
                `;
              } else {
                col2Html = `<div></div>`;
              }

              setsBlockHtml += `
                <div class="hevy-set-row ${isDone ? 'done' : ''}">
                  <button class="set-btn ${isDone ? 'completed' : ''}"
                    onclick="toggleExerciseSet('${ex.id}', ${s}, ${ex.restSec || 60})">
                    ${isDone ? '✓' : '○'} ${btnLbl}
                  </button>
                  <div class="hevy-input-box">
                    <span>${m0.label}</span>
                    <input type="number" step="0.5" value="${val0}"
                      onchange="updateSetMetric('${m0.key}', ${s}, this.value)" />
                  </div>
                  ${col2Html}
                </div>
              `;
            }
            setsBlockHtml += `</div>`;
          } else {
            // Postural / Neck exercises (1-5) without load-rep inputs
            setsBlockHtml += `<div class="sets-row">`;
            for (let s = 0; s < effSets; s++) {
              const sKey = `w${p}_${d}_${ex.id}_s${s}`;
              const isDone = Boolean(ST.setsDone[sKey]);
              if (!isDone) allSetsDone = false;
              setsBlockHtml += `
                <button class="set-btn ${isDone ? 'completed' : ''}"
                  onclick="toggleExerciseSet('${ex.id}', ${s}, ${ex.restSec || 60})">
                  ${isDone ? '✓' : '○'} Set ${s + 1}
                </button>
              `;
            }
            setsBlockHtml += `</div>`;
          }

          html += `
            <div class="card ${allSetsDone ? 'card-green' : ''}">
              <div class="card-header">
                <div class="card-title">${ex.title}</div>
                <span class="badge-pill ${ex.compound ? 'badge-gold' : 'badge-cyan'}">
                  ${ex.setsLabel || `${ex.warmupSet ? 'WU + ' : ''}${effSets} ${ex.unitLabel || 'Set'}`}
                </span>
              </div>

              ${ex.warning ? `<div class="warn-banner">${ex.warning}</div>` : ''}

              <div class="meta-strip">
                ${ex.tag ? `<span class="meta-chip" style="border-color:rgba(212,175,55,0.45);"><b style="color:var(--gold);">${ex.tag}</b></span>` : ''}
                ${ex.tempo ? `<span class="meta-chip">Tempo: <b>${ex.tempo}</b></span>` : ''}
                <span class="meta-chip">Rep: <b>${ex.reps}</b></span>
                <span class="meta-chip">Acuan: <b>${ex.load}</b></span>
                <span class="meta-chip">Istirahat: <b>${ex.restSec}s</b></span>
                <span class="meta-chip">Target 19 Des: <b>${ex.target19Dec}</b></span>
                <span class="meta-chip">Fokus: <b>${ex.plafon}</b></span>
              </div>

              ${setsBlockHtml}

              <div class="action-row">
                <button class="btn" onclick="startFloatingTimer(${ex.restSec || 60}, 'Istirahat: ${ex.title.replace(/'/g, '')}', false)">
                  ⏱️ Rest ${ex.restSec}s
                </button>
                ${ex.activeTimerSec ? `
                  <button class="btn btn-gold" onclick="startFloatingTimer(${ex.activeTimerSec}, 'Durasi Aktif: ${ex.title.replace(/'/g, '')}', true)">
                    ⚡ Timer Aktif ${ex.activeTimerSec}s
                  </button>
                ` : ''}
                <button class="btn" onclick="toggleAccordion('info-${ex.id}')">
                  📖 Panduan Teknis
                </button>
              </div>

              <div id="info-${ex.id}" class="info-box">${ex.info}</div>
            </div>
          `;
        });
      }

      // 6. GUIDED RUN CARD (TUE RUN 1 [riwayat W0–W2: setelah Lower], FRI RUN 2, SUN RUN 3)
      if (runSession && !runFirst) {
        html += renderRunCardHtml(runSession, p, d);
      }

      // 7. CONTEXT-AWARE COOL-DOWN ACCORDION (30s timer withPrep = true)
      if (wcData && wcData.cooldown) {
        html += `
          <button class="acc-header" onclick="toggleAccordion('acc-cooldown')">
            <span>${wcData.cooldownTitle}</span>
            <span style="color:var(--cyan);">▼</span>
          </button>
          <div id="acc-cooldown" class="acc-body open">
            ${wcData.cooldown.map((c, idx) => `
              <div style="padding:7px 0; border-bottom:${idx < wcData.cooldown.length - 1 ? '1px solid var(--border)' : 'none'};">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                  <strong style="font-size:12.5px;">${c.title}</strong>
                  <span class="badge-pill badge-cyan">${c.badge}</span>
                </div>
                <div style="font-size:11.5px; color:var(--muted); margin-top:3px;">${c.info}</div>${c.timerSec > 0 ? `
                  <button class="btn btn-cyan" style="margin-top:6px; padding:5px 9px;"
                    onclick="startFloatingTimer(${c.timerSec}, '${c.title.replace(/'/g, '')}', true)">
                    ⏱️ Timer ${c.timerSec} dtk
                  </button>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }

      // 8. OPTIONAL SWIM CARD (DURASI, JARAK, LAPS & GAYA)
      const swimKey = `w${p}_${d}`;
      const swimRec = ST.swimDone[swimKey] || { dur: '20', dist: '', laps: '1', style: 'Dada / Punggung Santai', done: false };
      html += `
        <button class="acc-header" onclick="toggleAccordion('acc-swim')">
          <span>🏊 Sesi Renang Opsional (Pemulihan Aktif & Kapasitas Paru)</span>
          <span style="color:var(--cyan);">${swimRec.done ? '✓ Selesai' : '▼'}</span>
        </button>
        <div id="acc-swim" class="acc-body ${swimRec.done ? 'open' : ''}">
          ${readiness.mode === 'red' ? `
            <div class="danger-banner">🛑 DILARANG berenang pada hari Saklar MERAH!</div>
          ` : `
            <div style="font-size:11.5px; color:var(--muted); margin-bottom:8px;">
              Hanya di kolam berpenjaga / bersama teman. Segera naik, keringkan badan & minum hangat bila kram, menggigil, atau bibir membiru (vasokonstriksi).
            </div>
            <div class="grid-2" style="margin-bottom:8px;">
              <div class="field-box">
                <label>Durasi Renang (mnt)</label>
                <input type="number" placeholder="20" value="${swimRec.dur || ''}" onchange="updateSwimField('dur', this.value)" />
              </div>
              <div class="field-box">
                <label>Jarak (meter)</label>
                <input type="number" step="25" placeholder="cth: 250" value="${swimRec.dist || ''}" onchange="updateSwimField('dist', this.value)" />
              </div>
              <div class="field-box">
                <label>Laps (Putaran)</label>
                <input type="number" placeholder="1" value="${swimRec.laps !== undefined ? swimRec.laps : '1'}" onchange="updateSwimField('laps', this.value)" />
              </div>
              <div class="field-box">
                <label>Gaya / Fokus</label>
                <input type="text" placeholder="Dada / Bebas" value="${swimRec.style || ''}" onchange="updateSwimField('style', this.value)" />
              </div>
            </div>
            <button class="set-btn ${swimRec.done ? 'completed' : ''}" style="width:100%;"
              onclick="updateSwimField('done', ${!swimRec.done})">
              ${swimRec.done ? '✓ Renang Opsional Tercatat' : '○ Tandai Sesi Renang Selesai'}
            </button>
          `}
        </div>
      `;

      return html;
    }
    /* =========================================================================
       11. TAB 2 RENDERER: 📈 PROGRESS (PACE-HR, JANGKAR, BB, ANTRO, LIFTS, REKAP)
       ========================================================================= */
    function updatePaceHrCell(stage, field, val) {
      ST.paceHrTest[stage][field] = val;
      saveState();
      renderApp();
    }

    function updateWeightCell(weekIdx, key, val) {
      if (!ST.bodyWeight[weekIdx]) ST.bodyWeight[weekIdx] = { b1: '', b2: '', b3: '' };
      ST.bodyWeight[weekIdx][key] = val;
      saveState();
      renderApp();
    }

    function updateAnthroCell(stage, field, val) {
      if (!ST.anthropometry[stage]) ST.anthropometry[stage] = { fa_relax: '', fa_flex: '', upper_arm: '', shoulder: '', chest: '' };
      ST.anthropometry[stage][field] = val;
      saveState();
      renderApp();
    }

    function getWeekAvgWeight(wIdx) {
      const rec = ST.bodyWeight[wIdx];
      if (!rec) return null;
      const nums = [rec.b1, rec.b2, rec.b3]
        .filter(v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v)) && Number(v) > 30)
        .map(Number);
      if (!nums.length) return null;
      return +(nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(2);
    }

    function checkStagnantWeightAlert() {
      const p = Number(ST.phase);
      if (p >= 2) {
        const curAvg = getWeekAvgWeight(p);
        const prev2Avg = getWeekAvgWeight(p - 2);
        if (curAvg !== null && prev2Avg !== null && (curAvg - prev2Avg) <= 0.1) {
          return true;
        }
      }
      const loggedWeeks = [];
      for (let w = 0; w <= MAX_PHASE; w++) {
        const avg = getWeekAvgWeight(w);
        if (avg !== null) loggedWeeks.push({ w, avg });
      }
      if (loggedWeeks.length >= 3) {
        const last = loggedWeeks[loggedWeeks.length - 1];
        const prev2 = loggedWeeks[loggedWeeks.length - 3];
        if ((last.avg - prev2.avg) <= 0.1) return true;
      }
      return false;
    }

    function getWeekReadinessRecap(w) {
      const out = { green: 0, yellow: 0, red: 0 };
      DAYS.forEach(d => {
        const rec = ST.readinessLog[`w${w}_${d}`];
        if (!rec) return;
        const hasData = (rec.rhr !== '' && rec.rhr !== undefined) || (rec.sleep !== '' && rec.sleep !== undefined) || (rec.feel && rec.feel !== 'fresh');
        if (!hasData) return;
        const r = getCurrentReadiness(w, d);
        out[r.mode] += 1;
      });
      return out;
    }

    function renderProgressTab() {
      const p = Number(ST.phase);
      const w0Hr = Number(ST.paceHrTest.w0.hr60);
      const w8Hr = Number(ST.paceHrTest.w8.hr60);
      const w4Hr = Number(ST.paceHrTest.w4.hr60);
      const latestHr = w8Hr || w4Hr || 0;
      const deltaHr = (w0Hr && latestHr) ? (latestHr - w0Hr) : null;

      const w0Spd = Number(ST.paceHrTest.w0.spd145);
      const latestSpd = Number(ST.paceHrTest.w8.spd145) || Number(ST.paceHrTest.w4.spd145) || 0;
      const deltaSpd = (w0Spd && latestSpd) ? +(latestSpd - w0Spd).toFixed(1) : null;

      const w0Vo2 = Number(ST.paceHrTest.w0.vo2);
      const latestVo2 = Number(ST.paceHrTest.w8.vo2) || Number(ST.paceHrTest.w4.vo2) || 0;
      const deltaVo2 = (w0Vo2 && latestVo2) ? +(latestVo2 - w0Vo2).toFixed(1) : null;

      const isStagnant = checkStagnantWeightAlert();
      const weeks = [];
      for (let w = 0; w <= MAX_PHASE; w++) weeks.push(w);
      const anthro = stage => ST.anthropometry[stage] || {};
      const aVal = (stage, field) => {
        const v = anthro(stage)[field];
        return (v === undefined || v === null) ? '' : v;
      };
      const fmtNum = v => (v === null || v === undefined || v === '') ? '—' : v;

      // Gerbang tarik vertikal (untuk Master Lift & Kesiapan Kalistenik)
      const negGate = getNegativeGateStatus(MAX_PHASE + 1);
      const strictRes = [4, 8].map(w => ({ w, v: getStoredMetric(w, 'spu_reps_s0') })).filter(o => o.v !== null);
      const negLogged = getStoredMetric(MAX_PHASE, 'neg_reps_s0') !== null || weeks.some(w => getStoredMetric(w, 'neg_reps_s0') !== null);
      const fepuFirst = (() => {
        for (let w = 0; w <= MAX_PHASE; w++) {
          const v = getStoredMetric(w, 'fepu_reps_s0');
          if (v !== null) return { w, v };
        }
        return null;
      })();
      const ohteFirst = (() => {
        for (let w = 0; w <= MAX_PHASE; w++) {
          const v = getStoredMetric(w, 'ohte_kg_s0');
          if (v !== null) return { w, v };
        }
        return null;
      })();
      const firstStored = key => {
        for (let w = 0; w <= MAX_PHASE; w++) {
          const v = getStoredMetric(w, key);
          if (v !== null) return { w, v };
        }
        return null;
      };
      const sucFirst = firstStored('suc_kg_s0');
      const bhcFirst = firstStored('bhc_kg_s0');
      const apuPinNow = getSetMetricVal('apu2_kg', 0, getSetMetricVal('apu_kg', 0, 22.5));
      const apuRepNow = getSetMetricVal('apu2_reps', 0, getSetMetricVal('apu_reps', 0, 8));

      let html = `
        <div class="section-label">
          <span>🎯 TABEL 1 — TES SUBMAKSIMAL PACE-HR (10 Mnt @ 6,0 km/j)</span>
        </div>
        <div class="card card-gold">
          <div style="font-size:11.5px; color:var(--muted); margin-bottom:6px;">
            Titik resmi: <b>W0 (Ahad 25 Okt)</b>, <b>M4 (Ahad 22 Nov)</b>, dan <b>M8 (Jumat 18 Des)</b> — menit ke-10 s.d. ke-20 di 6,0 km/j (0%), status Hijau. HR latihan bervariasi ±3% (±4 bpm), jadi baca sebagai tren bersama Blok Pantau.
          </div>
          ${deltaHr !== null && deltaHr <= -4 ? `
            <div class="card card-green" style="padding:8px 10px; margin-bottom:8px;">
              📉 <b>Sinyal efisiensi aerobik:</b> Delta HR <b>${deltaHr} bpm</b> (≥ 4–6 bpm di pace yang sama). Dianggap nyata bila konsisten di Blok Pantau beberapa Ahad.
            </div>
          ` : ''}
          ${deltaSpd !== null && deltaSpd >= 0.5 ? `
            <div class="card card-green" style="padding:8px 10px; margin-bottom:8px;">
              ✅ <b>Tujuan pace tercapai:</b> kecepatan di HR 145–150 bpm naik <b>+${deltaSpd} km/j</b> (≥ 0,5 km/j).
            </div>
          ` : ''}
          <div class="table-wrap">
            <table class="af-table">
              <thead>
                <tr>
                  <th>Parameter</th>
                  <th>W0 (Ahd 25 Okt)</th>
                  <th>M4 (Ahd 22 Nov)</th>
                  <th>M8 (Jum 18 Des)</th>
                  <th>Delta</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><b>1. Avg HR @ 6,0 km/j (bpm)</b></td>
                  <td><input type="number" value="${ST.paceHrTest.w0.hr60}" onchange="updatePaceHrCell('w0','hr60',this.value)" /></td>
                  <td><input type="number" value="${ST.paceHrTest.w4.hr60}" onchange="updatePaceHrCell('w4','hr60',this.value)" /></td>
                  <td><input type="number" value="${ST.paceHrTest.w8.hr60}" onchange="updatePaceHrCell('w8','hr60',this.value)" /></td>
                  <td style="font-weight:700; color:${deltaHr !== null && deltaHr <= -4 ? 'var(--green)' : 'var(--gold)'};">
                    ${deltaHr !== null ? (deltaHr > 0 ? `+${deltaHr}` : deltaHr) + ' bpm' : '—'}
                  </td>
                </tr>
                <tr>
                  <td><b>2. Speed @ HR 145–150 (km/j)</b></td>
                  <td><input type="number" step="0.1" value="${ST.paceHrTest.w0.spd145}" onchange="updatePaceHrCell('w0','spd145',this.value)" /></td>
                  <td><input type="number" step="0.1" value="${ST.paceHrTest.w4.spd145}" onchange="updatePaceHrCell('w4','spd145',this.value)" /></td>
                  <td><input type="number" step="0.1" value="${ST.paceHrTest.w8.spd145}" onchange="updatePaceHrCell('w8','spd145',this.value)" /></td>
                  <td style="font-weight:700; color:${deltaSpd !== null && deltaSpd >= 0.5 ? 'var(--green)' : 'var(--cyan)'};">
                    ${deltaSpd !== null ? (deltaSpd > 0 ? `+${deltaSpd}` : deltaSpd) + ' km/j' : '—'}
                  </td>
                </tr>
                <tr>
                  <td><b>3. Skor VO2max Jam (tren; target +2–4)</b></td>
                  <td><input type="number" step="0.5" value="${ST.paceHrTest.w0.vo2}" onchange="updatePaceHrCell('w0','vo2',this.value)" /></td>
                  <td><input type="number" step="0.5" value="${ST.paceHrTest.w4.vo2}" onchange="updatePaceHrCell('w4','vo2',this.value)" /></td>
                  <td><input type="number" step="0.5" value="${ST.paceHrTest.w8.vo2}" onchange="updatePaceHrCell('w8','vo2',this.value)" /></td>
                  <td style="font-weight:700; color:var(--green);">
                    ${deltaVo2 !== null ? (deltaVo2 > 0 ? `+${deltaVo2}` : deltaVo2) : '—'}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- TABEL 2: TREN HR JANGKAR & BLOK PANTAU (F.2, F.5, F.7) -->
        <div class="section-label">
          <span>⚓ TABEL 2 — TREN HR JANGKAR & BLOK PANTAU (bpm)</span>
        </div>
        <div class="card">
          <div style="font-size:11.5px; color:var(--muted); margin-bottom:6px;">
            HR jangkar menit-4 (jalan 4,8 → jog 5,5 km/j) yang turun dari pekan ke pekan = adaptasi; yang melonjak = kelelahan. Drift Jumat = Jangkar Jumat − Jangkar Ahad pekan sebelumnya (≥ +8 → Tempo diganti Easy Z2). 🎯 = hari tes.
          </div>
          <div class="table-wrap">
            <table class="af-table">
              <thead>
                <tr>
                  <th>Pekan</th>
                  <th>Jangkar Sel</th>
                  <th>Jangkar Jum</th>
                  <th>Jangkar Ahd</th>
                  <th>Blok Pantau</th>
                  <th>Drift Jum</th>
                </tr>
              </thead>
              <tbody>
                ${weeks.map(w => {
                  const tue = getStoredMetric(w, 'run1_anchor_hr');
                  const fri = getStoredMetric(w, 'run2_anchor_hr');
                  const sun = getStoredMetric(w, 'run3_anchor_hr');
                  let block = getStoredMetric(w, 'run3_block_hr');
                  const testV = (w === 0 || w === 4 || w === 8) ? getTestHrValue(w) : null;
                  const blockTxt = testV !== null ? `🎯 ${testV}` : fmtNum(block);
                  const prevSun = getPrevSundayAnchor(w);
                  const drift = (fri !== null && prevSun !== null && !isNaN(Number(fri))) ? (Number(fri) - prevSun) : null;
                  return `
                    <tr style="${w === p ? 'background:rgba(212,175,55,0.08);' : ''}">
                      <td><b>W${w}</b></td>
                      <td>${fmtNum(tue)}</td>
                      <td>${fmtNum(fri)}</td>
                      <td>${fmtNum(sun)}</td>
                      <td style="font-weight:700; color:var(--cyan);">${blockTxt}</td>
                      <td style="font-weight:700; color:${drift !== null && drift >= 8 ? 'var(--red)' : 'var(--green)'};">${drift !== null ? (drift > 0 ? '+' + drift : drift) : '—'}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- TABEL 3: BODY WEIGHT 3X/WEEK & STAGNATION ALERT -->
        <div class="section-label">
          <span>⚖️ TABEL 3 — BERAT BADAN 3x/PEKAN (TARGET 54 → 55 KG)</span>
        </div>
        <div class="card">
          ${isStagnant ? `
            <div class="warn-banner">
              ⚠️ RATA-RATA BB STAGNAN 2–3 PEKAN: sinyal untuk mengevaluasi asupan (panduan nutrisi di luar blueprint V3.0). Laju ideal ±0,15–0,25 kg/pekan.
            </div>
          ` : ''}
          <div style="font-size:12px; font-weight:600; margin-bottom:8px; color:var(--gold);">
            Input Timbangan Pagi Pekan Aktif (W${p}) — setelah buang air kecil, pakaian minimal:
          </div>
          <div class="grid-3" style="margin-bottom:10px;">
            <div class="field-box">
              <label>BB Pagi 1 (Selasa)</label>
              <input type="number" step="0.1" placeholder="54.0" value="${(ST.bodyWeight[p] && ST.bodyWeight[p].b1) || ''}"
                onchange="updateWeightCell(${p}, 'b1', this.value)" />
            </div>
            <div class="field-box">
              <label>BB Pagi 2 (Jumat)</label>
              <input type="number" step="0.1" placeholder="54.1" value="${(ST.bodyWeight[p] && ST.bodyWeight[p].b2) || ''}"
                onchange="updateWeightCell(${p}, 'b2', this.value)" />
            </div>
            <div class="field-box">
              <label>BB Pagi 3 (Ahad)</label>
              <input type="number" step="0.1" placeholder="54.2" value="${(ST.bodyWeight[p] && ST.bodyWeight[p].b3) || ''}"
                onchange="updateWeightCell(${p}, 'b3', this.value)" />
            </div>
          </div>

          <div class="table-wrap">
            <table class="af-table">
              <thead>
                <tr>
                  <th>Pekan</th>
                  <th>Selasa</th>
                  <th>Jumat</th>
                  <th>Ahad</th>
                  <th>Rata-rata</th>
                </tr>
              </thead>
              <tbody>
                ${weeks.map(w => {
                  const bw = ST.bodyWeight[w] || { b1: '', b2: '', b3: '' };
                  const avg = getWeekAvgWeight(w);
                  return `
                    <tr style="${w === p ? 'background:rgba(212,175,55,0.08);' : ''}">
                      <td><b>W${w}</b></td>
                      <td>${bw.b1 || '—'}</td>
                      <td>${bw.b2 || '—'}</td>
                      <td>${bw.b3 || '—'}</td>
                      <td style="font-weight:700; color:var(--gold);">${avg !== null ? avg + ' kg' : '—'}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- TABEL 4: ANTHROPOMETRY W0 / M4 / M8 (H.2) -->
        <div class="section-label">
          <span>📏 TABEL 4 — ANTROPOMETRI & FOTO (W0, M4, M8)</span>
        </div>
        <div class="card">
          <div style="font-size:11.5px; color:var(--muted); margin-bottom:6px;">
            Foto tampak depan, samping, dan belakang di tempat & pencahayaan yang sama.
          </div>
          <div class="table-wrap">
            <table class="af-table">
              <thead>
                <tr>
                  <th>Titik Ukur (cm)</th>
                  <th>W0</th>
                  <th>M4</th>
                  <th>M8</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><b>1. Lengan Bawah Terlebar — Rileks (1/3 Atas)</b></td>
                  <td><input type="number" step="0.1" value="${aVal('w0','fa_relax')}" onchange="updateAnthroCell('w0','fa_relax',this.value)" /></td>
                  <td><input type="number" step="0.1" value="${aVal('w4','fa_relax')}" onchange="updateAnthroCell('w4','fa_relax',this.value)" /></td>
                  <td><input type="number" step="0.1" value="${aVal('w8','fa_relax')}" onchange="updateAnthroCell('w8','fa_relax',this.value)" /></td>
                </tr>
                <tr>

    /* =========================================================================
       12. TAB 3 RENDERER: 🗓️ LOG (10-WEEK MATRIX & JSON BACKUP/RESTORE)
       ========================================================================= */
    function copyBackupJson() {
      const dataStr = JSON.stringify(ST, null, 2);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(dataStr).then(() => {
          alert('✅ Data JSON AEROFRAME V4.0 berhasil disalin ke Clipboard!');
        }).catch(() => {});
      }
      const box = document.getElementById('json-io-box');
      if (box) box.value = dataStr;
    }

    function downloadBackupJson() {
      const dataStr = JSON.stringify(ST, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `aeroframe_v40_backup_W${ST.phase}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJson() {
      const box = document.getElementById('json-io-box');
      if (!box || !box.value.trim()) {
        alert('Tempelkan (Paste) teks JSON terlebih dahulu di kotak bawah!');
        return;
      }
      try {
        const parsed = JSON.parse(box.value.trim());
        ST = migrateLegacyState(parsed);
        saveState();
        renderApp();
        alert('✅ Data JSON berhasil dipulihkan dengan migrasi backward compatibility aman!');
      } catch (e) {
        alert('❌ Format JSON tidak valid!');
      }
    }

        </div>
        <div class="card">
          <div style="font-size:11.5px; color:var(--muted); margin-bottom:8px;">
            Seluruh log latihan (termasuk metrik per set ala Hevy, Set 0, & pace lari) tersimpan otomatis di perangkat bawah kunci <code>${STORAGE_KEY}</code>. File backup JSON lama otomatis dikonversi aman tanpa crash.
          </div>
          <div class="action-row" style="margin-bottom:8px;">
            <button class="btn btn-gold" onclick="copyBackupJson()">📋 Copy JSON</button>
            <button class="btn btn-cyan" onclick="downloadBackupJson()">⬇️ Download .JSON</button>
            <button class="btn btn-green" onclick="importBackupJson()">📥 Import JSON</button>
          </div>
          <textarea id="json-io-box" rows="6" placeholder="Tempel (Paste) JSON di sini untuk Import, atau klik Copy JSON..."
            style="width:100%; background:var(--s2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px; font-family:monospace; font-size:11px;"></textarea>
        </div>
      `;
      return html;
    }

    function renderInsightTab() {
      let html = `

      `;
      INSIGHT_MODULES.forEach((mod, idx) => {
        html += `

            <span style="color:var(--gold);">▼</span>

          <div id="ins-mod-${idx}" class="acc-body ${idx === 0 ? 'open' : ''}">

            `).join('')}
          </div>
        `;

      return html;

    /* =========================================================================
       14. MASTER APPLICATION RENDERER & BOOTSTRAP
       ========================================================================= */
    function renderApp() {
      updateHeaderReadinessPill();
      const container = document.getElementById('app-content');
      if (!container) return;

      if (ST.tab === 'workout') {
        container.innerHTML = renderWorkoutTab();
      } else if (ST.tab === 'progress') {
        container.innerHTML = renderProgressTab();
      } else if (ST.tab === 'log') {
        container.innerHTML = renderLogTab();
      } else if (ST.tab === 'insight') {
        container.innerHTML = renderInsightTab();
      }
    }

    function registerOfflineServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('Mode Offline Siap (Scope):', reg.scope);
          })
          .catch((err) => {
            console.warn('Registrasi Service Worker gagal:', err);
          });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initHeadsetAudioElement();
      renderApp();
      armWakeLockOnFirstTouch();
      registerOfflineServiceWorker();
    });
