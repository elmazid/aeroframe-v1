<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12141A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="AEROFRAME 4.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <title>AEROFRAME V4.0 — Endurance & Aesthetic Hybrid System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12141A;
      --s1: #1A1D24;
      --s2: #22262F;
      --s3: #2C313D;
      --border: #2E3440;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --gold: #D4AF37;
      --gold-dim: rgba(212, 175, 55, 0.15);
      --green: #10B981;
      --green-dim: rgba(16, 185, 129, 0.15);
      --red: #EF4444;
      --red-dim: rgba(239, 68, 68, 0.16);
      --ora: #F59E0B;
      --ora-dim: rgba(245, 158, 11, 0.15);
      --cyan: #38BDF8;
      --cyan-dim: rgba(56, 189, 248, 0.15);
      --font-head: 'Rajdhani', sans-serif;
      --font-body: 'Sora', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0B0C10;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13.5px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg);
      min-height: 100vh;
      position: relative;
      padding-bottom: 92px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255,255,255,0.04);
      border-right: 1px solid rgba(255,255,255,0.04);
    }

    /* TOP HEADER */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(18, 20, 26, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 14px 10px !important;
      padding-top: calc(16px + env(safe-area-inset-top, 0px)) !important;
    }

    .top-row-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-sub {
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 500;
      display: block;
      margin-top: -2px;
    }

    .btn-audio-test {
      background: var(--s2);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-audio-test:active {
      transform: scale(0.96);
      background: var(--cyan-dim);
    }

    .btn-audio-test.unlocked {
      color: var(--green);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .top-row-2 {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .phase-select {
      flex: 1;
      background: var(--s1);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .badge-pill {
      padding: 4px 8px;
      border-radius: 6px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-gold { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(212,175,55,0.35); }
    .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.35); }
    .badge-ora { background: var(--ora-dim); color: var(--ora); border: 1px solid rgba(245,158,11,0.35); }
    .badge-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.35); }
    .badge-cyan { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(56,189,248,0.35); }

    /* MAIN CONTENT CONTAINER */
    .main-view {
      padding: 12px 14px;
    }

    /* CARDS & PANELS */
    .card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 12px;
    }

    .card-gold {
      border-color: rgba(212, 175, 55, 0.45);
      background: linear-gradient(180deg, rgba(212,175,55,0.07) 0%, var(--s1) 100%);
    }

    .card-green {
      border-color: rgba(16, 185, 129, 0.45);
      background: linear-gradient(180deg, rgba(16,185,129,0.07) 0%, var(--s1) 100%);
    }

    .card-ora {
      border-color: rgba(245, 158, 11, 0.45);
      background: linear-gradient(180deg, rgba(245,158,11,0.08) 0%, var(--s1) 100%);
    }

    .card-red {
      border-color: rgba(239, 68, 68, 0.55);
      background: linear-gradient(180deg, rgba(239,68,68,0.12) 0%, var(--s1) 100%);
    }

    .card-cyan {
      border-color: rgba(56, 189, 248, 0.45);
      background: linear-gradient(180deg, rgba(56,189,248,0.08) 0%, var(--s1) 100%);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-title {
      font-family: var(--font-head);
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text);
      line-height: 1.25;
    }

    .section-label {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* INPUTS & GRIDS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .field-box {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
    }

    .field-box label {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 500;
    }

    .field-box input, .field-box select {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-head);
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    .field-box input::placeholder {
      color: rgba(156, 163, 175, 0.4);
    }

    /* TOGGLE SWITCHES */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }

    .toggle-row span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .switch-pill {
      width: 40px;
      height: 22px;
      background: var(--s3);
      border-radius: 99px;
      position: relative;
      transition: 0.2s;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .switch-pill::after {
      content: '';
      width: 16px;
      height: 16px;
      background: var(--muted);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.2s;
    }

    .switch-pill.on {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    .switch-pill.on::after {
      background: var(--gold);
      transform: translateX(18px);
    }

    /* DAY BAR SELECTOR (MON - SUN) */
    .day-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 10px 0 12px;
    }

    .day-btn {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .day-btn .d-name {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      display: block;
    }

    .day-btn .d-tag {
      font-size: 9.5px;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }

    .day-btn.active {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    .day-btn.active .d-name {
      color: var(--gold);
    }

    .day-btn.done-day::after {
      content: '';
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
      position: absolute;
      top: 4px;
      right: 4px;
    }

    /* EXERCISE SETS & BUTTONS */
    .meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
    }

    .meta-chip {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--s2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .meta-chip b {
      color: var(--text);
    }

    .warn-banner {
      background: var(--ora-dim);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #FDE68A;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 500;
      margin-bottom: 9px;
    }

    .danger-banner {
      background: var(--red-dim);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #FECACA;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .sets-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .set-btn {
      flex: 1;
      min-width: 72px;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 8px;
      border-radius: 8px;
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s;
    }

    .set-btn.completed {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }

    .r7-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 7px;
    }

    .r7-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
    }

    .r7-item .r7-mark {
      min-width: 18px;
      font-family: var(--font-head);
      font-weight: 700;
      color: var(--muted);
    }

    .r7-item.done {
      background: var(--green-dim);
      border-color: var(--green);
    }

    .r7-item.done .r7-mark {
      color: var(--green);
    }

    /* HEVY-STYLE PER-SET LOGGING ROWS */
    .hevy-sets-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 10px 0;
    }

    .hevy-header {
      display: grid;
      grid-template-columns: 88px 1fr 1fr;
      gap: 6px;
      padding: 0 4px;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .hevy-set-row {
      display: grid;
      grid-template-columns: 88px 1fr 1fr;
      gap: 6px;
      align-items: stretch;
      background: rgba(34, 38, 47, 0.45);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px;
      transition: all 0.15s ease;
    }

    .hevy-set-row.warmup-row {
      background: rgba(212, 175, 55, 0.06);
      border-color: rgba(212, 175, 55, 0.35);
    }

    .hevy-set-row.done {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .hevy-set-row .set-btn {
      min-width: 0;
      padding: 7px 6px;
      font-size: 13px;
    }

    .hevy-warmup-note {
      grid-column: 1 / -1;
      font-size: 11px;
      color: #FDE68A;
      background: rgba(245, 158, 11, 0.1);
      border-top: 1px dashed rgba(212, 175, 55, 0.3);
      padding: 5px 7px;
      border-radius: 5px;
      margin-top: 2px;
      line-height: 1.35;
    }

    .hevy-input-box {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hevy-set-row.done .hevy-input-box {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .hevy-input-box span {
      font-size: 9.5px;
      color: var(--muted);
      line-height: 1.1;
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hevy-input-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-head);
      font-size: 15.5px;
      font-weight: 700;
      outline: none;
    }

    .action-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s;
    }

    .btn:active { transform: scale(0.97); }
    .btn-gold { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .btn-green { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .btn-cyan { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }
    .btn-red { background: var(--red-dim); border-color: var(--red); color: var(--red); }

    .info-box {
      background: var(--s2);
      border-left: 3px solid var(--gold);
      padding: 9px 11px;
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      color: #D1D5DB;
      white-space: pre-line;
      margin-top: 8px;
      display: none;
    }

    .info-box.open {
      display: block;
    }

    /* ACCORDION */
    .acc-header {
      width: 100%;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      margin-bottom: 8px;
    }

    .acc-body {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      margin-top: -4px;
      margin-bottom: 10px;
      display: none;
    }

    .acc-body.open {
      display: block;
    }

    /* FLOATING REST / ACTIVE TIMER BAR */
    .floating-timer {
      position: fixed;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 456px;
      background: rgba(26, 29, 36, 0.97);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 10px 13px;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 25px rgba(0,0,0,0.75);
    }

    .floating-timer.active {
      display: flex;
    }

    .ft-time {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .ft-label {
      font-size: 11px;
      color: var(--muted);
      max-width: 190px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* GUIDED RUN TIMER BOX */
    .run-console {
      background: var(--s2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
    }

    .run-clock {
      font-family: var(--font-head);
      font-size: 38px;
      font-weight: 700;
      color: var(--cyan);
      text-align: center;
      letter-spacing: 1px;
      line-height: 1.05;
      margin: 6px 0;
    }

    .run-step-list {
      max-height: 190px;
      overflow-y: auto;
      margin-top: 9px;
      border-top: 1px solid var(--border);
      padding-top: 7px;
    }

    .run-step-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .run-step-item.current {
      background: var(--cyan-dim);
      color: var(--text);
      font-weight: 600;
      border-left: 3px solid var(--cyan);
    }

    .run-step-item.done {
      opacity: 0.45;
      text-decoration: line-through;
    }

    /* TABLES */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 6px;
    }

    table.af-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    table.af-table th, table.af-table td {
      border: 1px solid var(--border);
      padding: 7px 6px;
      text-align: left;
    }

    table.af-table th {
      background: var(--s2);
      color: var(--gold);
      font-family: var(--font-head);
      font-size: 12.5px;
      font-weight: 700;
    }

    table.af-table td input {
      width: 100%;
      min-width: 48px;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 4px 5px;
      font-family: var(--font-head);
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(18, 20, 26, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 55;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--muted);
      padding: 9px 4px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: 0.15s;
    }

    .nav-item .nav-ico {
      font-size: 17px;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--gold);
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <!-- Preloaded Headset Media Stream Audio Element -->
    <audio id="headset-chime" preload="auto"></audio>

    <!-- Sticky Header -->
    <header class="top-bar">
      <div class="top-row-1">
        <div>
          <div class="brand-title">⚡ AEROFRAME V4.0</div>
          <span class="brand-sub">Endurance & Aesthetic Hybrid • 54→55 kg</span>
        </div>

    // BLUEPRINT V3.0: fase gym W0–W8 (W9 transisi kalistenik dipindah ke dokumen terpisah)
    const MAX_PHASE = 8;
    const V3_START_PHASE = 3;          // V3.0 berlaku penuh mulai W3 (Senin, 9 Nov 2026)
    const V3_UPPER_B_START_PHASE = 2;  // Upper B V3.0 (Assisted Pull-Up di Sabtu) sejak Sabtu W2 (7 Nov 2026)

    const V4_UPPER_B_START_PHASE = 2;  // V4.0 dimajukan mulai Sabtu W2 (7 Nov 2026): Sabtu & Ahad W2 sudah V4.0

    const LONG_RUN_TARGETS = [35, 38, 40, 42, 45, 45, 48, 50, 50];

    function getCurrentDayKey() {
      const jsDay = new Date().getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat

    const DEFAULT_STATE = {
      tab: 'workout',

      day: getCurrentDayKey(),
      swapTueWed: false,

      readinessLog: {},   // key: `w${phase}_${day}` -> { rhr, sleep, feel, status }
      domsLog: {},        // key: `w${phase}` -> { score: 2, hrDrift: false }
      setsDone: {},       // key: `w${phase}_${day}_${exId}_s${idx}` or `_sw0` -> boolean
      metrics: {},        // key: `w${phase}_${metricKey}_s${idx}` or `_sw0` or run metric

      paceHrTest: {

      },
      bodyWeight: {
        0: { b1: '53.0', b2: '', b3: '' },
        1: { b1: '', b2: '', b3: '' },
        2: { b1: '', b2: '', b3: '' },
        3: { b1: '', b2: '', b3: '' },
        4: { b1: '', b2: '', b3: '' },
        5: { b1: '', b2: '', b3: '' },
        6: { b1: '', b2: '', b3: '' },

    // Helper: Convert legacy speed (km/h) to Pace (menit/km -> "mm:ss")
    function convertSpeedToPace(spdVal) {
      const spd = parseFloat(spdVal);
      if (isNaN(spd) || spd <= 0) return '';
      const totalMin = 60 / spd;
      let mm = Math.floor(totalMin);
      let ss = Math.round((totalMin - mm) * 60);
      if (ss === 60) {
        mm += 1;
        ss = 0;
      }
      return `${mm}:${String(ss).padStart(2, '0')}`;
    }

    // Backward Compatibility Migration Script for Legacy JSON Backups
    function migrateLegacyState(parsedObj) {
      const base = JSON.parse(JSON.stringify(DEFAULT_STATE));
      if (!parsedObj || typeof parsedObj !== 'object') return base;

      const merged = Object.assign({}, base, parsedObj, {
        swapTueWed: false
      });

      merged.readinessLog = Object.assign({}, base.readinessLog, parsedObj.readinessLog || {});
      merged.domsLog = Object.assign({}, base.domsLog, parsedObj.domsLog || {});
      merged.setsDone = Object.assign({}, base.setsDone, parsedObj.setsDone || {});
      merged.metrics = Object.assign({}, base.metrics, parsedObj.metrics || {});
      merged.swimDone = Object.assign({}, base.swimDone, parsedObj.swimDone || {});
      merged.paceHrTest = Object.assign({}, base.paceHrTest, parsedObj.paceHrTest || {});
      merged.bodyWeight = Object.assign({}, base.bodyWeight, parsedObj.bodyWeight || {});
      merged.anthropometry = Object.assign({}, base.anthropometry, parsedObj.anthropometry || {});

      // V3.0: fase W0–W8 (W9 dihapus). Data pekan apa pun tetap tersimpan utuh, hanya pilihan pekan aktif yang dibatasi.
      if (isNaN(Number(merged.phase)) || Number(merged.phase) < 0) merged.phase = 0;
      if (Number(merged.phase) > MAX_PHASE) merged.phase = MAX_PHASE;

      const mKeys = Object.keys(merged.metrics);
      mKeys.forEach(k => {
        const val = merged.metrics[k];
        if (val === undefined || val === null || val === '') return;

        // 1. Migrate legacy run speed (w{p}_run{1..3}_spd) -> pace (w{p}_run{1..3}_pace)
        const spdMatch = k.match(/^w(\d+)_run([123])_spd$/);
        if (spdMatch) {
          const p = spdMatch[1];
          const rNum = spdMatch[2];
          const paceKey = `w${p}_run${rNum}_pace`;
          if (merged.metrics[paceKey] === undefined || merged.metrics[paceKey] === '') {
            const converted = convertSpeedToPace(val);
            if (converted) merged.metrics[paceKey] = converted;
          }
          return;
        }

        // Skip keys that are already per-set (_s0, _s1, etc.), Set 0 warmup (_sw0), or run metrics
        if (/_(s\d+|sw\d+)$/.test(k) || /^w\d+_(run[123]_|test_hr_60)/.test(k)) {
          return;
        }

        // 2. Migrate legacy global gym metrics (w{p}_{metricKey}) -> per-set (_s0, _s1, _s2, _s3)
        const gymMatch = k.match(/^w(\d+)_(.+)$/);
        if (gymMatch) {
          const p = gymMatch[1];
          const metricName = gymMatch[2];
          for (let s = 0; s < 4; s++) {
            const perSetKey = `w${p}_${metricName}_s${s}`;
            if (merged.metrics[perSetKey] === undefined || merged.metrics[perSetKey] === '') {
              merged.metrics[perSetKey] = val;
            }
          }
          // Special mapping if legacy dh_sec was logged -> map to Set 3 (s2) of ub_6b
          if (metricName === 'dh_sec') {
            const hangSetKey = `w${p}_dwc2_reps_s2`;
            if (merged.metrics[hangSetKey] === undefined || merged.metrics[hangSetKey] === '') {
              merged.metrics[hangSetKey] = val;
            }
          }
        }
      });

      return merged;
    }

    let ST = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        const migrated = migrateLegacyState(parsed);
        migrated.day = getCurrentDayKey();
        return migrated;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ST));
      } catch (e) {
        console.error('Save failed:', e);
      }
    }

    /* =========================================================================
       2. DUAL-STREAM HEADSET AUDIO ENGINE & WAKE LOCK
       ========================================================================= */
    let audioCtx = null;
    let wakeLockSentinel = null;

    function buildHeadsetChimeDataURI() {
      const sampleRate = 44100;
      const durationSec = 0.65;
      const numSamples = Math.floor(sampleRate * durationSec);
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, numSamples * 2, true);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        let sample = 0;
        if (t < 0.14) {
          sample = Math.sin(2 * Math.PI * 880 * t) * Math.exp(-t * 8);
        } else if (t >= 0.18 && t < 0.32) {
          const dt = t - 0.18;
          sample = Math.sin(2 * Math.PI * 880 * dt) * Math.exp(-dt * 8);
        } else if (t >= 0.36 && t < 0.64) {
          const dt = t - 0.36;
          sample = Math.sin(2 * Math.PI * 1320 * dt) * Math.exp(-dt * 5);
        }
        const pcmVal = Math.max(-1, Math.min(1, sample * 0.85));
        view.setInt16(44 + i * 2, pcmVal < 0 ? pcmVal * 0x8000 : pcmVal * 0x7FFF, true);
      }

      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    function initHeadsetAudioElement() {
      const el = document.getElementById('headset-chime');
      if (el && !el.src) {
        el.src = buildHeadsetChimeDataURI();
        el.volume = 1.0;
      }
    }

    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
          console.log('Screen Wake Lock aktif.');
        }
      } catch (err) {
        console.warn('Wake Lock gagal / tidak didukung:', err);
      }
    }

    function armWakeLockOnFirstTouch() {
      const activate = () => {
        requestScreenWakeLock();
        if (!ST.audioUnlocked) {
          unlockHeadsetAudio(false);
        }
        window.removeEventListener('click', activate);
        window.removeEventListener('touchstart', activate);
      };
      window.addEventListener('click', activate, { once: true });
      window.addEventListener('touchstart', activate, { once: true });
    }

    function unlockHeadsetAudio(playDemo = false) {
      initHeadsetAudioElement();
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const el = document.getElementById('headset-chime');
      if (el) {
        el.currentTime = 0;
        const p = el.play();
        if (p !== undefined) {
          p.then(() => {
            if (!playDemo) {
              el.pause();
              el.currentTime = 0;
            }
          }).catch(() => {});
        }
      }
      if (playDemo) {
        playWebAudioBeep(880, 0.12);
        setTimeout(() => playWebAudioBeep(1320, 0.22), 160);
        if (navigator.vibrate) navigator.vibrate([150, 80, 200]);
      }
      ST.audioUnlocked = true;
      const btn = document.getElementById('btn-audio-unlock');
      if (btn) {
        btn.classList.add('unlocked');
        btn.innerHTML = '🔊 Headset Aktif ✓';
      }
      requestScreenWakeLock();
    }

    function playWebAudioBeep(freq = 660, dur = 0.12) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function triggerCompletionAlarm() {
      const el = document.getElementById('headset-chime');
      if (el) {
        el.currentTime = 0;
        el.play().catch(() => {});
      }
      playWebAudioBeep(880, 0.16);
      setTimeout(() => playWebAudioBeep(1320, 0.30), 180);
      if (navigator.vibrate) {
        navigator.vibrate([250, 100, 250, 100, 400]);
      }
    }
    /* =========================================================================
       3. CONTEXT-AWARE WARM-UP & COOL-DOWN DATABASE PER DAY (BLUEPRINT V3.0 — D)
       ========================================================================= */
    function getEffectiveScheduleType(dayKey) {
      // V3.0: Selasa = Lari 1 (Easy Z2 + Strides) -> Gym Lower (mulai W3; riwayat W0–W2: Lower -> Lari 1), Rabu = Upper A
      if (dayKey === 'tue') return 'lower_plus_run1';
      if (dayKey === 'wed') return 'upper_a';
      return dayKey;
    }

    // V3.0 berlaku penuh mulai W3 (Senin, 9 Nov 2026). Upper B V3.0 berlaku sejak Sabtu W2 (7 Nov 2026).
    function isV3(p) {
      return Number(p) >= V3_START_PHASE;
    }

    function isRunFirstTuesday(p) {
      return isV3(p);
    }

    function isReturnWeek(p) {
      return ST.returnWeek !== null && ST.returnWeek !== undefined && ST.returnWeek !== '' && Number(ST.returnWeek) === Number(p);
    }

    // Pekan Adaptasi W0 atau Protokol Mulai/Kembali (C.5) yang diaktifkan untuk pekan ini
    function isStartMode(p) {
      return Number(p) === 0 || isReturnWeek(p);
    }

    // Gerbang DOMS Kamis PEKAN LALU -> mengatur Lower Selasa pekan ini (C.3: "Selasa berikutnya")
    function getTuesdayDomsGate(p) {
      p = Number(p);
      if (p <= 0) return { score: 2, logged: false, gate: 'green', applies: false, fromWeek: null };
      const rec = ST.domsLog['w' + (p - 1)];
      const logged = Boolean(rec && rec.score !== undefined && rec.score !== null && rec.score !== '');
      const score = logged ? Number(rec.score) : 2;
      const gate = score >= 6 ? 'red' : (score >= 4 ? 'yellow' : 'green');
      return { score, logged, gate, applies: isV3(p), fromWeek: p - 1 };
    }

    function isPogoActive(p) {
      const g = getTuesdayDomsGate(p);
      return Number(p) >= 4 && Number(p) <= MAX_PHASE && g.score <= 3 && !isStartMode(p);
    }

        {

        {

        },

          timerSec: 40,
          info: 'Tarik napas 4 detik lewat hidung, embuskan 6 detik lewat mulut, 3–4 kali.'
        }
      ];

      const lowerRunCooldown = [
        {

          badge: '2 mnt',

      // Upper Body Days (Rabu Upper A & Sabtu Upper B)
      if (schedType === 'upper_a' || schedType === 'upper_b' || dayKey === 'sat' || schedType === 'upper_a_plus_run1') {

      if (schedType === 'lower_plus_run1' || schedType === 'lower_only') {

          const list = [
            {

      // Selasa (lari → lower): Rutin 7 Gerakan → Lari 1 → (W4+) Pogo Hops → Set 0 RDL
      if (dayKey === 'tue') {
        const gate = getTuesdayDomsGate(p);

      if (dayKey === 'fri' || dayKey === 'sun') {

    function numberExercises(list) {

          n += 1;
          ex.title = `${n}. ${ex.name}`;
        }
      });
      return list;
    }

      // sehingga lonjakan RHR pagi ini tidak ikut menaikkan baseline pembandingnya.
      if (p !== undefined && d !== undefined) {
        const valid = v => v !== undefined && v !== null && v !== '' && !isNaN(Number(v)) && Number(v) >= 35 && Number(v) <= 110;
        const limit = Number(p) * 7 + DAYS.indexOf(d);
        const prior = Object.keys(ST.readinessLog)
          .map(k => {
            const m = k.match(/^w(\d+)_(mon|tue|wed|thu|fri|sat|sun)$/);
            return m ? { ord: Number(m[1]) * 7 + DAYS.indexOf(m[2]), rhr: (ST.readinessLog[k] || {}).rhr } : null;
          })
          .filter(o => o && o.ord < limit && valid(o.rhr))
          .sort((a, b) => a.ord - b.ord)
          .map(o => Number(o.rhr));
        if (prior.length === 0) return 56;
        const last7 = prior.slice(-7);
        return Math.round(last7.reduce((a, b) => a + b, 0) / last7.length);
      }

      // Riwayat W0–W2 (V2.0): perhitungan lama dipertahankan
      const vals = [];
      Object.keys(ST.readinessLog).forEach(k => {
        const entry = ST.readinessLog[k];
        if (entry && entry.rhr && !isNaN(Number(entry.rhr)) && Number(entry.rhr) >= 35 && Number(entry.rhr) <= 110) {
          vals.push(Number(entry.rhr));
        }
      });
      if (vals.length === 0) return 56;
      const recent = vals.slice(-7);
      const sum = recent.reduce((a, b) => a + b, 0);
      return Math.round(sum / recent.length);
    }

    function getPrevDayRef(p, d) {
      const idx = DAYS.indexOf(d);
      if (idx > 0) return { p: Number(p), d: DAYS[idx - 1] };
      if (Number(p) > 0) return { p: Number(p) - 1, d: 'sun' };
      return null;
    }

    function getCurrentReadiness(p = ST.phase, d = ST.day) {
      const key = `w${p}_${d}`;
      const rec = ST.readinessLog[key] || { rhr: '', sleep: '', feel: 'fresh' };
      const base = isV3(p) ? getRollingRhrBaseline(p, d) : getRollingRhrBaseline();
      const feel = rec.feel || 'fresh';
      let mode = 'green';

      // Riwayat W0–W2: aturan V2.0 dipertahankan agar tampilan pekan lalu tidak berubah
      if (!isV3(p)) {
        const rhr = rec.rhr !== '' ? Number(rec.rhr) : base;
        const sleep = rec.sleep !== '' ? Number(rec.sleep) : 7.0;
        if (sleep < 5.0 || rhr >= base + 7 || rhr >= 60 || feel === 'sick') {
          mode = 'red';
        } else if ((sleep >= 5.0 && sleep < 6.5) || (rhr >= base + 5 && rhr <= base + 6) || feel === 'tired') {
          mode = 'yellow';
        }
        return { mode, rhr: rec.rhr, sleep: rec.sleep, feel, base, rhrWatch: false };
      }

      // V3.0 (B.2): semua ambang relatif terhadap baseline, tanpa batas angka absolut
      const hasVal = v => v !== '' && v !== undefined && v !== null && !isNaN(Number(v));
      const rhrLogged = hasVal(rec.rhr);
      const rhr = rhrLogged ? Number(rec.rhr) : base;
      const sleep = hasVal(rec.sleep) ? Number(rec.sleep) : 7.0;

      const prevRef = getPrevDayRef(p, d);
      const prevRec = prevRef ? ST.readinessLog[`w${prevRef.p}_${prevRef.d}`] : null;
      const prevRhr = (prevRec && hasVal(prevRec.rhr)) ? Number(prevRec.rhr) : null;
      const prevBase = prevRef ? getRollingRhrBaseline(prevRef.p, prevRef.d) : base;
      const up56 = rhrLogged && rhr >= base + 5 && rhr <= base + 6;
      const prevUp = prevRhr !== null && prevRhr >= prevBase + 5;

      if (sleep < 5.0 || (rhrLogged && rhr >= base + 7) || feel === 'sick') {
        mode = 'red';
      } else if ((sleep >= 5.0 && sleep < 6.5) || (up56 && prevUp) || feel === 'tired') {
        mode = 'yellow';
      }
      const rhrWatch = up56 && !prevUp && mode === 'green';
      return { mode, rhr: rec.rhr, sleep: rec.sleep, feel, base, rhrWatch };
    }

    // Gerbang DOMS (skor Kamis). V3.0: HR Drift adalah saklar terpisah khusus Jumat.
    function getDomsStatus(p = ST.phase) {
      const rec = ST.domsLog['w' + p] || { score: 2, hrDrift: false };
      const score = Number(rec.score ?? 2);
      const hrDrift = Boolean(rec.hrDrift);

      let gate = 'green';
      if (score >= 6) {
        gate = 'red';
      } else if (score >= 4) {
        gate = 'yellow';
      }
      return { gate, score, hrDrift };
    }

    // Nilai metrik tersimpan apa adanya (tanpa mewarisi pekan sebelumnya)
    function getStoredMetric(p, key) {
      const v = ST.metrics[`w${p}_${key}`];
      return (v === undefined || v === null || v === '') ? null : v;
    }

    // Sama seperti getSetMetricVal, tetapi untuk pekan tertentu (dipakai evaluasi gerbang)
    function getSetMetricValAt(pTarget, metricKey, setIdx, defVal) {
      for (let p = Number(pTarget); p >= 0; p--) {
        const sk = `w${p}_${metricKey}_s${setIdx}`;
        if (ST.metrics[sk] !== undefined && ST.metrics[sk] !== '') return ST.metrics[sk];
        const lk = `w${p}_${metricKey}`;
        if (ST.metrics[lk] !== undefined && ST.metrics[lk] !== '') return ST.metrics[lk];
      }
      return defVal;
    }

    function getTestStageKey(p) {
      if (Number(p) === 0) return 'w0';
      if (Number(p) === 4) return 'w4';
      if (Number(p) === 8) return 'w8';
      return null;
    }

    function getTestHrValue(p) {
      const stored = getStoredMetric(p, 'test_hr_60');
      if (stored !== null) return stored;
      const stage = getTestStageKey(p);
      if (stage && ST.paceHrTest[stage] && ST.paceHrTest[stage].hr60 !== '' && ST.paceHrTest[stage].hr60 !== undefined) {
        return ST.paceHrTest[stage].hr60;
      }
      return null;
    }

    // HR Jangkar Ahad sebelumnya (pembanding Saklar HR Drift Jumat)
    function getPrevSundayAnchor(p) {
      if (Number(p) <= 0) return null;
      const v = getStoredMetric(Number(p) - 1, 'run3_anchor_hr');
      return v !== null && !isNaN(Number(v)) ? Number(v) : null;
    }

    // Ringkasan sesi Assisted Pull-Up Sabtu (V3.0) pada pekan w
    function getAssistedSessionInfo(w) {
      if (Number(w) < V3_UPPER_B_START_PHASE) return null;
      const fallbackPin = Number(getSetMetricValAt(w, 'apu_kg', 0, 22.5)) || 22.5;
      let anyDone = false;
      let allDone = true;
      let maxPin = 0;
      let minReps = 99;
      for (let s = 0; s < 3; s++) {
        const done = Boolean(ST.setsDone[`w${w}_sat_ub_apu_s${s}`]);
        if (done) anyDone = true;
        else allDone = false;
        const pin = Number(getSetMetricValAt(w, 'apu2_kg', s, fallbackPin));
        const reps = Number(getSetMetricValAt(w, 'apu2_reps', s, 8));
        maxPin = Math.max(maxPin, isNaN(pin) ? 99 : pin);
        minReps = Math.min(minReps, isNaN(reps) ? 0 : reps);
      }
      if (!anyDone) return null;
      return { w: Number(w), allDone, maxPin, minReps };
    }

    // Gerbang Negative Pull-Up (E.7): Assisted 3 × 8 di RIR 2 pada pin ≤ 15 kg, dua sesi berurutan
    function getNegativeGateStatus(p) {
      const sessions = [];
      for (let w = V3_UPPER_B_START_PHASE; w < Number(p); w++) {
        const info = getAssistedSessionInfo(w);
        if (info) sessions.push(info);
      }
      const ok = s => s.allDone && s.maxPin <= 15 && s.minReps >= 8;
      let open = false;
      for (let i = 1; i < sessions.length; i++) {
        if (ok(sessions[i]) && ok(sessions[i - 1])) {
          open = true;
          break;
        }
      }
      let streak = 0;
      for (let i = sessions.length - 1; i >= 0; i--) {
        if (ok(sessions[i])) streak++;
        else break;
      }
      const last = sessions.length ? sessions[sessions.length - 1] : null;
      return { open, streak: Math.min(streak, 2), last };
    }

    // Gerbang Uji Strict Pull-Up: Assisted 3 × 8 pada pin ±10–12,5 kg (sesi sebelum hari evaluasi)
    function getStrictGateStatus(p) {
      for (let w = V3_UPPER_B_START_PHASE; w < Number(p); w++) {
        const s = getAssistedSessionInfo(w);
        if (s && s.allDone && s.maxPin <= 12.5 && s.minReps >= 8) return { open: true, w };
      }
      return { open: false };
    }

    /* =========================================================================
       6. GUIDED RUN QUEUE BUILDER (BLUEPRINT V3.0 — F: JANGKAR, LARI 1/2/3, TES)
       ========================================================================= */
    // Jangkar 4 Menit — standar semua sesi lari (F.2)
    function getAnchorSegments() {
      return [
        { label: 'Jangkar 1/2 — Jalan 4,8 km/jam', sec: 60, desc: '00:00–01:00 jalan 4,8 km/jam. Kecepatan jangkar tidak ikut dinaikkan walau kebugaran meningkat.' },
        { label: 'Jangkar 2/2 — Jog 5,5 km/jam (±10:55/km)', sec: 180, desc: '01:00–04:00. Di menit ke-4 catat HR → kotak HR Jangkar.' }
      ];
    }

    function buildRunMetrics(prefix, o) {
      const list = [
        { key: `${prefix}_min`, label: 'Durasi (mnt)', def: o.min },
        { key: `${prefix}_km`, label: 'Jarak (km)', def: '' },
        { key: `${prefix}_pace`, label: 'Pace (menit/km)', def: o.pace, isText: true, placeholder: `mm:ss (cth ${o.pace})` },
        { key: `${prefix}_best_pace`, label: 'Pace Tercepat (/km)', def: '', isText: true, placeholder: 'mm:ss' },
        { key: `${prefix}_hr`, label: o.hrLabel || 'Avg HR (bpm)', def: '' },
        { key: `${prefix}_max`, label: 'Max HR (bpm)', def: '' },
        { key: `${prefix}_rpe`, label: 'RPE (1-10)', def: o.rpe }
      ];
      if (o.anchor) list.push({ key: `${prefix}_anchor_hr`, label: '⚓ HR Jangkar mnt-4 (bpm)', def: '', noCarry: true });
      if (o.block) list.push({ key: 'run3_block_hr', label: '📊 Avg HR Blok Pantau 6,0', def: '', noCarry: true });
      if (o.test) list.push({ key: 'test_hr_60', label: '🎯 Avg HR Tes 6,0 km/j', def: '', noCarry: true });
      return list;
    }

    function getRunSessionForDay(dayKey, p = Number(ST.phase)) {
      p = Number(p);
      const schedType = getEffectiveScheduleType(dayKey);
      const readiness = getCurrentReadiness(p, dayKey);
      const doms = getDomsStatus(p);
      const start = isStartMode(p);

      // 1. SELASA LARI 1 — Easy Z2 + Strides (V3.0: SEBELUM Lower, kaki segar) — F.3
      if (schedType === 'lower_plus_run1' || schedType === 'upper_a_plus_run1') {
        const runFirst = isRunFirstTuesday(p);
        const queue = getAnchorSegments();
        queue.push({ label: 'Z2 Konstan 12–15 mnt (138–152 bpm)', sec: 900, desc: 'Mulai ±6,0 km/jam (10:00/km), sesuaikan 5,8–6,3 km/jam agar HR tenang di 140–148 bpm & lulus talk test. Boleh Next setelah menit ke-12.' });
        if (start) {
          queue.push({ label: 'Jalan Transisi', sec: 60, desc: '4,0–4,5 km/jam. Pekan pertama: tanpa strides.' });
        } else {
          for (let i = 1; i <= 3; i++) {
            queue.push({ label: `Stride #${i}/3 — CEPAT (cadence ±170)`, sec: 20, desc: '±9,0–10,0 km/jam (6:40–6:00/km), RPE ±7, bukan sprint. Mulai dari batas bawah. Tekan tombol naik ±4 dtk sebelum segmen dimulai.' });
            queue.push({ label: `Jalan Pemulihan #${i}/3`, sec: 40, desc: '4,5 km/jam' });
          }
          queue.push({ label: 'Jalan Transisi', sec: 60, desc: runFirst ? '4,0–4,5 km/jam → lanjut ke Lower (W4+: pogo hops dulu); jaga jeda ke RDL tetap singkat. Pendinginan lengkap setelah Lower.' : '4,0–4,5 km/jam → pendinginan.' });
        }
        const totalMin = start ? 20 : 23;

        return {
          id: 'run1',
          title: `LARI 1 (${runFirst ? 'Sebelum Lower' : 'Setelah Lower'}): Easy Run Zona 2 ${start ? '(Tanpa Strides)' : '+ 3× Strides'} — ±${totalMin} Menit`,
          warning: runFirst
            ? '👟 Urutan Selasa: Rutin 7 Gerakan → Lari 1 dengan sepatu lari → lepas sepatu untuk Lower (gerakan 1–3). Jangan mulai dengan perut kosong atau kurang minum (sehari setelah puasa Senin).'
            : '👟 Pasang kembali SEPATU LARI berbantalan nyaman sebelum mulai berlari!',
          targetBadge: `${totalMin} Menit ${start ? '(Z2 Murni)' : '(Termasuk Strides)'}`,
          hrZoneBadge: 'Zona 2: 138–152 bpm',
          queue,
          guide: (isV4(p) ? '• Sebelum lari: Rutin Pemanasan 7 Gerakan (±2,5 mnt). Total Selasa ±25 mnt (Rutin + Lari 1) + ±37 mnt (Lower).\n' : '') + '• Jangkar 4 menit (F.2): 00:00–01:00 jalan 4,8 km/jam → 01:00–04:00 jog 5,5 km/jam. Catat HR menit ke-4 di kotak HR Jangkar. Kecepatan jangkar tidak ikut dinaikkan karena fungsinya sebagai pembanding.\n• Blok Z2: mulai ±6,0 km/jam (10:00/km), sesuaikan 5,8–6,3 km/jam agar HR tenang di 140–148 bpm (rentang Z2 138–152) dan lulus talk test.\n• Strides 3 × [20 dtk cepat + 40 dtk jalan]: ±1,5–2 km/jam di atas kecepatan tempo (saat ini ±9,0–10,0 km/jam, ±6:40–6:00/km); cepat tapi rileks, cadence tinggi ±170 langkah/menit, RPE ±7, bukan sprint. Mulai dari batas bawah kecepatan.\n• Tips strides: tekan tombol naik ±4 detik sebelum segmen 20 detik dimulai agar sabuk treadmill sempat berakselerasi.\n• Kriteria berhasil: (1) HR stabil di Z2 tanpa merayap ke Z3 selama blok Z2 — bila di 6,0 km/jam HR masih < 138 bpm, naikkan bertahap sampai 6,3 km/jam (tanda kebugaran membaik). (2) Beban × repetisi RDL dan Goblet Squat di RIR 3 tidak turun dibanding pekan sebelumnya.\n• Rencana cadangan: bila RDL turun satu tahap dua pekan berturut-turut, blok Z2 dipendekkan menjadi 10 menit. Bila HR tetap kacau walau kaki segar, cek sensor (hitung nadi manual 15 detik × 4 di menit ke-5; jam terpasang pas 1–2 jari di atas tulang pergelangan; tangan lepas dari handrail) dan kecukupan minum, bukan urutan sesi.\n• Pekan pertama pengguna baru: jangkar 4 mnt + 15 mnt Z2 + 1 mnt jalan, tanpa strides.',
          metrics: buildRunMetrics('run1', { min: totalMin, pace: '10:43', rpe: 4.5, anchor: true })
        };
      }

      // 2. JUMAT LARI 2 — Tempo Z3 (≥ 14:00, treadmill) / Tes Pace-HR #3 W8 / Auto-Modifikasi — F.4
      if (dayKey === 'fri') {
        const prevSun = getPrevSundayAnchor(p);
        const anchorRefText = prevSun !== null
          ? ` HR Jangkar Ahad lalu: <b>${prevSun} bpm</b> → batas drift <b>${prevSun + 8} bpm</b>.`
          : '';
        const run2Guide = '• Prasyarat Tempo: Saklar Hijau, Gerbang DOMS 0–3, dan HR jangkar kurang dari +8 bpm dibanding Ahad sebelumnya.\n' + (isV4(p)
          ? '• Pemanasan (±40 mnt total sesi): Rutin 7 Gerakan → jangkar 4 mnt (catat HR menit ke-4) → jog Z2 5–6 mnt (±6,0 km/jam) → 2 × [15–20 dtk pick-up di ±8,5 km/jam + 40 dtk jalan] → interval dimulai ±1 menit kemudian. Pick-up hanya pada hari Tempo (W3–W7); tidak dipakai saat Easy Run pengganti (Kuning, Gerbang DOMS, HR Drift, Deload). Hari tes: Rutin 7 Gerakan lalu protokol tes apa adanya.\n'
          : '• Pemanasan: mobilitas pra-lari → jangkar 4 mnt → 2 mnt jog Z2 (±6,0 km/jam).\n') + '• Inti: estimasi kecepatan Z3 saat ini ±7,5–8,0 km/jam (±8:00–7:30/km), RPE 6–7, HR 166 bpm sebagai pagar atas. Pemulihan antar-interval: jalan cepat atau jog santai 5,0–6,0 km/jam.\n• Kontrol: HR menembus 166 bpm atau napas mencapai RPE 8 → turunkan 0,2–0,3 km/jam. Di akhir interval HR masih < 152 bpm dan RPE ≤ 5 → naikkan 0,2–0,3 km/jam di interval berikutnya.\n• Sensor optik pergelangan bisa tertinggal beberapa puluh detik saat kecepatan berubah; pada interval, kecepatan dan RPE menjadi kemudi utama.\n• Pendinginan: 4–5 mnt jog pelan menuju jalan (5,5 → 4,5 km/jam), lalu pendinginan lower (D.3).\n• W7: boleh dilakukan di outdoor pada rute datar; kemudi RPE + HR, pace jam sebagai acuan.\n• Tahapan: W0 3 × [3 mnt Z3 + 90 dtk] · W1–W2 4 × [3 mnt + 90 dtk] · W3–W4 3 × [5 mnt + 2 mnt jog] · W5–W6 2 × [8 mnt + 2 mnt jog] (W5 Deload: Easy Z2 25 mnt) · W7 20 mnt non-stop · W8 Tes Pace-HR #3 (Jumat 18 Des).';

        if (doms.gate === 'red') {
          return {
            id: 'run2',
            isWalk: true,
            title: '🛑 LARI 2 DIGANTI: Jalan Santai / Istirahat Penuh (DOMS ≥ 6)',
            warning: '🚨 Gerbang DOMS MERAH (skor ≥ 6): Tempo dibatalkan. Jalan santai 20–25 menit dengan HR < 130 bpm, atau istirahat penuh. Volume Lower Selasa depan dipangkas 50% (otomatis).',
            targetBadge: '20–25 Menit Jalan Santai',
            hrZoneBadge: 'HR < 130 bpm',
            queue: [
              { label: 'Jalan Kaki Santai (HR < 130 bpm)', sec: 1200, desc: '±4,2–4,8 km/jam, atau istirahat penuh. Boleh diperpanjang hingga 25 menit.' }
            ],
            guide: run2Guide,
            metrics: buildRunMetrics('run2', { min: 20, pace: '13:20', rpe: 3.0, anchor: false })
          };
        }

        const isTestDay = (p === MAX_PHASE);
        const reasons = [];
        if (readiness.mode === 'yellow') reasons.push('Saklar Kuning');
        if (doms.gate === 'yellow') reasons.push(`Gerbang DOMS Kuning (skor ${doms.score})`);
        if (doms.hrDrift) reasons.push('HR Drift ≥ +8 bpm');
        if (p === 5 && ST.w5Deload) reasons.push('Deload W5');

        // W8: Tes Pace-HR #3 menggantikan Tempo (treadmill hanya tersedia sampai 19 Des)
        if (isTestDay) {
          const notGreen = readiness.mode !== 'green' || reasons.length > 0;
          const queue = getAnchorSegments();
          queue.push({ label: 'Z2 6 mnt @ 6,0 km/jam', sec: 360, desc: 'Kunci 6,0 km/jam (10:00/km), kemiringan 0%.' });
          queue.push({ label: '🎯 TES: Kunci 6,0 km/jam — Catat Avg HR 10 mnt', sec: 600, desc: 'Menit 10–20. Jangan ubah kecepatan; catat rata-rata HR 10 menit di kotak Tes.' });
          queue.push({ label: 'Z2 Lanjutan 10–15 mnt', sec: 600, desc: '±6,0 km/jam (5,8–6,3), lulus talk test. Boleh ditambah hingga 15 menit.' });
          queue.push({ label: 'Jalan Santai', sec: 180, desc: '4,5 km/jam → pendinginan lower (D.3). Tanpa Tempo.' });
          return {
            id: 'run2',
            isTestWeek: true,
            title: '🎯 LARI 2 (Jumat 18 Des): Tes Pace-HR #3 — Menggantikan Tempo',
            warning: '🎯 Tes resmi #3 (dipindah ke Jumat karena treadmill hanya tersedia sampai 19 Des). Syarat: status Hijau; kemiringan treadmill sama (0%); waktu, makan, dan minum sebelum tes semirip mungkin dengan tes sebelumnya.' +
              (notGreen ? `<br>⚠️ Hari ini belum Hijau (${reasons.length ? reasons.join(', ') : 'Saklar ' + readiness.mode}): jalankan sebagai Easy Run Z2 dan anggap angka tes tidak representatif.` : '') +
              anchorRefText,
            targetBadge: '±33 Menit (Tes + Z2)',
            hrZoneBadge: 'Zona 2: 138–152 bpm',
            queue,
            guide: '• Cara: jangkar 4 mnt → 6 mnt Z2 di 6,0 km/jam → menit 10–20 kunci 6,0 km/jam, catat Avg HR 10 menit. Jumat 18 Des: lanjutkan 10–15 mnt Z2 lalu pendinginan, tanpa Tempo.\n• Membaca hasil: HR latihan memiliki variasi harian ±3% (±4 bpm; Buchheit, 2014). Penurunan 4–6 bpm di satu tes adalah sinyal awal; dianggap nyata bila terlihat konsisten pada Blok Pantau beberapa Ahad.\n• Angka masuk otomatis ke Tabel Tes Pace-HR (kolom M8) di tab Progress.',
            metrics: buildRunMetrics('run2', { min: 33, pace: '10:20', rpe: 4.5, anchor: true, test: true, hrLabel: 'Avg HR Sesi (bpm)' })
          };
        }

        if (reasons.length > 0) {
          const queue = getAnchorSegments();
          queue.push({ label: 'Easy Run Z2 Konstan (138–152 bpm)', sec: 1080, desc: '±6,0 km/jam (5,8–6,3) nyaman, lulus talk test.' });
          queue.push({ label: 'Jalan Santai', sec: 180, desc: '4,5 km/jam → pendinginan lower (D.3).' });
          return {
            id: 'run2',
            title: '⚡ LARI 2 (AUTO-MODIFIKASI): Easy Run Zona 2 Konstan (25 Menit)',
            warning: `⚠️ Tempo Z3 diganti Easy Run Z2 karena: <b>${reasons.join(', ')}</b>. Saklar/Gerbang Kuning: 25–30 menit; HR Drift & Deload: 25 menit.` + anchorRefText,
            targetBadge: '25 Menit Easy Run Z2',
            hrZoneBadge: 'Zona 2: 138–152 bpm',
            queue,
            guide: run2Guide,
            metrics: buildRunMetrics('run2', { min: 25, pace: '10:31', rpe: 5.0, anchor: true })
          };
        }

        // Tempo normal per tahap (F.4)
        let stageTitle = '';
        let reps = 0;
        let workSec = 0;
        let recSec = 0;
        let continuous = false;
        if (start) {
          stageTitle = `${p === 0 ? 'W0 Adaptasi' : 'Mulai/Kembali'} — 3 × [3 Menit Z3 + 90 dtk]`;
          reps = 3; workSec = 180; recSec = 90;
        } else if (p <= 2) {
          stageTitle = 'Cruise Intervals — 4 × [3 Menit Z3 + 90 dtk]';
          reps = 4; workSec = 180; recSec = 90;
        } else if (p <= 4) {
          stageTitle = 'Extended Intervals — 3 × [5 Menit Z3 + 2 Menit Jog]';
          reps = 3; workSec = 300; recSec = 120;
        } else if (p <= 6) {
          stageTitle = 'Threshold Blocks — 2 × [8 Menit Z3 + 2 Menit Jog]';
          reps = 2; workSec = 480; recSec = 120;
        } else {
          stageTitle = 'Continuous Tempo — 20 Menit Z3 Non-Stop';
          continuous = true;
        }

        const queue = getAnchorSegments();
        if (isV4(p)) {
          // V4.0 (D.1/F.4): jog Z2 5–6 mnt + 2 pick-up, interval dimulai ±1 menit kemudian
          queue.push({ label: 'Jog Z2 5–6 mnt', sec: 300, desc: '±6,0 km/jam (10:00/km). Boleh tambah hingga 6 menit.' });
          queue.push({ label: 'Pick-up #1/2 (15–20 dtk)', sec: 20, desc: '±8,5 km/jam, cepat tapi rileks — bukan sprint. Tekan tombol naik ±4 dtk sebelum segmen dimulai.' });
          queue.push({ label: 'Jalan #1/2', sec: 40, desc: 'Jalan santai.' });

          '24. Sporer, B. C., & Wenger, H. A. (2003). Effects of aerobic exercise on strength performance following various periods of recovery. <i>Journal of Strength and Conditioning Research</i>.',
          '25. Tan, J. G., Coburn, J. W., Brown, L. E., & Judelson, D. A. (2014). Effects of a single bout of lower-body aerobic exercise on muscle activation and performance during subsequent upper- and lower-body resistance exercise workouts. <i>Journal of Strength and Conditioning Research</i>.'
        ]
      }
    ];

    /* =========================================================================
       8. BACKGROUND-RESILIENT FLOATING TIMER & GUIDED RUN TIMER ENGINE
       ========================================================================= */
    let ftInterval = null;
    let ftTargetEnd = 0;
    let ftLastPipSec = null;
    let ftPrepMode = false;
    let ftPrepEnd = 0;
    let ftPendingSeconds = 0;
    let ftActualLabel = '';

    let runTimerState = {
      active: false,
      paused: false,
      prepMode: false,
      prepEndTime: 0,
      pendingRunSec: 0,
      dayKey: null,
      phase: null,
      stepIdx: 0,
      targetEndTime: 0,
      remainingSecOnPause: 0,
      lastPipSec: null,
      intervalId: null
    };

    function formatMMSS(totalSec) {
      const s = Math.max(0, Math.ceil(totalSec));
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    // withPrep = true hanya untuk timer durasi aktif (Dead Hang, Negative, Pemanasan/Pendinginan)
    // withPrep = false untuk semua timer Istirahat (Rest) agar langsung hitung mundur
    function startFloatingTimer(seconds, label = 'Timer Istirahat', withPrep = false) {
      unlockHeadsetAudio(false);
      if (ftInterval) clearInterval(ftInterval);

      const bar = document.getElementById('floating-timer');
      const lbl = document.getElementById('ft-label');
      const timeEl = document.getElementById('ft-time');
      if (bar) bar.classList.add('active');

      ftActualLabel = label;
      ftLastPipSec = null;

      if (withPrep) {
        ftPrepMode = true;
        ftPrepEnd = Date.now() + 3000;
        ftPendingSeconds = seconds;
        ftTargetEnd = 0;
        if (lbl) lbl.textContent = `⏳ Persiapan (3 dtk): ${label}`;
      } else {
        ftPrepMode = false;
        ftPrepEnd = 0;
        ftPendingSeconds = seconds;
        ftTargetEnd = Date.now() + seconds * 1000;
        if (lbl) lbl.textContent = label;
        if (timeEl) timeEl.style.color = 'var(--gold)';
      }

      tickFloatingTimer();
      ftInterval = setInterval(tickFloatingTimer, 200);
    }

    function tickFloatingTimer() {
      const timeEl = document.getElementById('ft-time');
      const lblEl = document.getElementById('ft-label');

      // Handle 3-Second Preparation Phase (hanya jika withPrep === true)
      if (ftPrepMode) {
        const prepRem = Math.ceil((ftPrepEnd - Date.now()) / 1000);
        if (prepRem > 0) {
          if (timeEl) {
            timeEl.style.color = 'var(--cyan)';
            timeEl.textContent = `SIAP ${prepRem}`;
          }
          if (ftLastPipSec !== prepRem) {
            ftLastPipSec = prepRem;
            playWebAudioBeep(520, 0.08);
          }
          return;
        }
        // Transition from Prep to Actual Timer
        ftPrepMode = false;
        ftLastPipSec = null;
        ftTargetEnd = Date.now() + ftPendingSeconds * 1000;
        if (lblEl) lblEl.textContent = ftActualLabel;
        if (timeEl) timeEl.style.color = 'var(--gold)';
        playWebAudioBeep(880, 0.16);
      }

      const rem = Math.ceil((ftTargetEnd - Date.now()) / 1000);

      if (rem <= 0) {
        if (timeEl) {
          timeEl.style.color = 'var(--gold)';
          timeEl.textContent = '00:00';
        }
        clearInterval(ftInterval);
        ftInterval = null;
        triggerCompletionAlarm();
        setTimeout(() => {
          const bar = document.getElementById('floating-timer');
          if (bar) bar.classList.remove('active');
        }, 1200);
        return;
      }

      if (timeEl) timeEl.textContent = formatMMSS(rem);

      if (rem <= 3 && rem >= 1 && ftLastPipSec !== rem) {
        ftLastPipSec = rem;
        playWebAudioBeep(660, 0.10);
      }
    }

    function adjustTimer(deltaSec) {
      if (ftPrepMode) {
        ftPendingSeconds = Math.max(5, ftPendingSeconds + deltaSec);
        return;
      }
      if (!ftTargetEnd) return;
      ftTargetEnd += deltaSec * 1000;
      tickFloatingTimer();
    }

    function stopFloatingTimer() {
      if (ftInterval) clearInterval(ftInterval);
      ftInterval = null;
      ftPrepMode = false;
      ftTargetEnd = 0;
      const timeEl = document.getElementById('ft-time');
      if (timeEl) timeEl.style.color = 'var(--gold)';
      const bar = document.getElementById('floating-timer');
      if (bar) bar.classList.remove('active');
    }

    // GUIDED RUN TIMER CONTROLS (+ 3S PREP ON START)
    function getActiveRunQueue() {
      const runObj = getRunSessionForDay(ST.day, Number(ST.phase));
      return runObj ? runObj.queue : [];
    }

    function startGuidedRun() {
      unlockHeadsetAudio(false);
      const queue = getActiveRunQueue();
      if (!queue.length) return;

      if (
        runTimerState.paused &&
        runTimerState.dayKey === ST.day &&
        runTimerState.phase === Number(ST.phase)
      ) {
        runTimerState.paused = false;
        runTimerState.active = true;
        runTimerState.prepMode = true;
        runTimerState.prepEndTime = Date.now() + 3000;
        runTimerState.pendingRunSec = runTimerState.remainingSecOnPause;
        runTimerState.lastPipSec = null;
      } else {
        const idx = (runTimerState.dayKey === ST.day && runTimerState.phase === Number(ST.phase))
          ? runTimerState.stepIdx
          : 0;
        const safeIdx = Math.min(idx, queue.length - 1);
        runTimerState.dayKey = ST.day;
        runTimerState.phase = Number(ST.phase);
        runTimerState.stepIdx = safeIdx;
        runTimerState.active = true;
        runTimerState.paused = false;
        runTimerState.prepMode = true;
        runTimerState.prepEndTime = Date.now() + 3000;
        runTimerState.pendingRunSec = queue[safeIdx].sec;
        runTimerState.lastPipSec = null;
      }

      if (runTimerState.intervalId) clearInterval(runTimerState.intervalId);
      tickGuidedRun();
      runTimerState.intervalId = setInterval(tickGuidedRun, 200);
      renderApp();
    }

    function pauseGuidedRun() {
      if (!runTimerState.active) return;
      if (runTimerState.prepMode) {
        runTimerState.remainingSecOnPause = runTimerState.pendingRunSec;
      } else {
        const rem = Math.max(1, Math.ceil((runTimerState.targetEndTime - Date.now()) / 1000));
        runTimerState.remainingSecOnPause = rem;
      }
      runTimerState.prepMode = false;
      runTimerState.paused = true;
      runTimerState.active = false;
      if (runTimerState.intervalId) clearInterval(runTimerState.intervalId);
      runTimerState.intervalId = null;
      renderApp();
    }

    function skipGuidedRunStep(dir = 1) {
      const queue = getActiveRunQueue();
      if (!queue.length) return;
      let nextIdx = runTimerState.stepIdx + dir;
      if (nextIdx < 0) nextIdx = 0;
      if (nextIdx >= queue.length) {
        resetGuidedRun();
        return;
      }
      runTimerState.stepIdx = nextIdx;
      runTimerState.prepMode = false;
      runTimerState.lastPipSec = null;
      runTimerState.remainingSecOnPause = queue[nextIdx].sec;
      if (runTimerState.active) {
        runTimerState.targetEndTime = Date.now() + queue[nextIdx].sec * 1000;
      }
      renderApp();
    }

    function resetGuidedRun() {
      if (runTimerState.intervalId) clearInterval(runTimerState.intervalId);
      runTimerState = {
        active: false,
        paused: false,
        prepMode: false,
        prepEndTime: 0,
        pendingRunSec: 0,
        dayKey: ST.day,
        phase: Number(ST.phase),
        stepIdx: 0,
        targetEndTime: 0,
        remainingSecOnPause: 0,
        lastPipSec: null,
        intervalId: null
      };
      renderApp();
    }

    function tickGuidedRun() {
      if (!runTimerState.active) return;
      const queue = getActiveRunQueue();
      if (!queue.length) return;

      const clockEl = document.getElementById('guided-run-clock');

      if (runTimerState.prepMode) {
        const prepRem = Math.ceil((runTimerState.prepEndTime - Date.now()) / 1000);
        if (prepRem > 0) {
          if (clockEl) clockEl.textContent = `SIAP ${prepRem}`;
          if (runTimerState.lastPipSec !== prepRem) {
            runTimerState.lastPipSec = prepRem;
            playWebAudioBeep(520, 0.08);
          }
          return;
        }
        runTimerState.prepMode = false;
        runTimerState.lastPipSec = null;
        runTimerState.targetEndTime = Date.now() + runTimerState.pendingRunSec * 1000;
        playWebAudioBeep(880, 0.16);
      }

      const rem = Math.ceil((runTimerState.targetEndTime - Date.now()) / 1000);

      if (rem <= 3 && rem >= 1 && runTimerState.lastPipSec !== rem) {
        runTimerState.lastPipSec = rem;
        playWebAudioBeep(660, 0.10);
      }

      if (rem <= 0) {
        triggerCompletionAlarm();
        if (runTimerState.stepIdx + 1 < queue.length) {
          runTimerState.stepIdx += 1;
          runTimerState.lastPipSec = null;
          runTimerState.targetEndTime = Date.now() + queue[runTimerState.stepIdx].sec * 1000;
          renderApp();
        } else {
          const doneKey = `w${ST.phase}_${ST.day}_run_done`;
          ST.setsDone[doneKey] = true;
          saveState();
          resetGuidedRun();
        }
        return;
      }

      if (clockEl) {
        clockEl.textContent = formatMMSS(rem);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (ftInterval) tickFloatingTimer();
        if (runTimerState.active) tickGuidedRun();
        requestScreenWakeLock();
      }
    });

    /* =========================================================================
       9. STATE MUTATION HANDLERS & PER-SET METRIC ENGINE (HEVY STYLE + SET 0)
       ========================================================================= */
    function switchTab(tabName) {
      ST.tab = tabName;
      saveState();
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('nav-' + tabName);
      if (activeBtn) activeBtn.classList.add('active');
      renderApp();
    }

    function changePhase(val) {
      ST.phase = Number(val);
      saveState();
      renderApp();
    }

    function selectDay(dayKey) {
      ST.day = dayKey;
      saveState();
      renderApp();
    }

    function updateReadinessField(field, val) {
      const key = `w${ST.phase}_${ST.day}`;
      if (!ST.readinessLog[key]) {
        ST.readinessLog[key] = { rhr: '', sleep: '', feel: 'fresh' };
      }
      ST.readinessLog[key][field] = val;
      saveState();
      renderApp();
    }

    function toggleStateFlag(flagKey) {
      ST[flagKey] = !ST[flagKey];
      saveState();
      renderApp();
    }

    function updateDomsField(field, val) {
      const key = 'w' + ST.phase;
      applyRunQueueChange(() => {
        if (!ST.domsLog[key]) {
          ST.domsLog[key] = { score: 2, hrDrift: false };
        }
        ST.domsLog[key][field] = val;
      });
      saveState();
      renderApp();
    }

    // V3.0: Protokol Mulai/Kembali (C.5) — aktif hanya untuk pekan yang sedang dipilih
    function toggleReturnMode() {
      const p = Number(ST.phase);
      applyRunQueueChange(() => {
        ST.returnWeek = isReturnWeek(p) ? null : p;
      });
      saveState();
      renderApp();
    }

    // Jika antrean lari hari ini berubah di tengah sesi (mis. Saklar HR Drift aktif setelah jangkar),
    // waktu yang sudah berjalan pada segmen aktif dipertahankan agar timer tidak melompat.
    function applyRunQueueChange(mutate) {
      const sameRun = (runTimerState.dayKey === ST.day && runTimerState.phase === Number(ST.phase));
      const oldQ = sameRun ? getActiveRunQueue() : [];
      const idx = runTimerState.stepIdx;
      const oldStep = (sameRun && (runTimerState.active || runTimerState.paused)) ? oldQ[idx] : null;
      let elapsed = 0;
      if (oldStep) {
        if (runTimerState.active && !runTimerState.prepMode) {
          elapsed = oldStep.sec - Math.max(0, Math.ceil((runTimerState.targetEndTime - Date.now()) / 1000));
        } else if (runTimerState.active && runTimerState.prepMode) {
          elapsed = oldStep.sec - runTimerState.pendingRunSec;
        } else if (runTimerState.paused) {
          elapsed = oldStep.sec - runTimerState.remainingSecOnPause;
        }
      }
      mutate();
      if (!oldStep) return;
      const newQ = getActiveRunQueue();
      if (!newQ.length) return;
      const nIdx = Math.min(idx, newQ.length - 1);
      const newStep = newQ[nIdx];
      runTimerState.stepIdx = nIdx;
      if (newStep.sec === oldStep.sec && newStep.label === oldStep.label) return;
      const rem = Math.max(1, newStep.sec - Math.max(0, elapsed));
      if (runTimerState.active && !runTimerState.prepMode) {
        runTimerState.targetEndTime = Date.now() + rem * 1000;
      } else if (runTimerState.active && runTimerState.prepMode) {
        runTimerState.pendingRunSec = rem;
      } else if (runTimerState.paused) {
        runTimerState.remainingSecOnPause = rem;
      }
    }

    // Set 0 (Warm-Up) isolated toggle handler (stored in _sw0 so _s0, _s1, _s2 never shift)
    // V4.0: set pemanasan tambahan (mis. set ramp RDL) memakai indeks berikutnya (_sw1)
    function toggleWarmupSet(exId, restSec, wuIdx = 0) {
      const key = `w${ST.phase}_${ST.day}_${exId}_sw${wuIdx}`;
      const nextVal = !ST.setsDone[key];
      ST.setsDone[key] = nextVal;
      saveState();
      if (nextVal && restSec > 0) {
        startFloatingTimer(restSec, wuIdx === 0 ? 'Transisi Set 0 -> Set 1' : 'Transisi Set Ramp -> Set 1', false);
      }
      renderApp();
    }

    function updateWarmupMetric(metricKey, val, wuIdx = 0) {
      const fullKey = `w${ST.phase}_${metricKey}_sw${wuIdx}`;
      ST.metrics[fullKey] = val;
      saveState();
    }

    function getWarmupMetricVal(metricKey, defVal) {
      const pCurr = Number(ST.phase);
      for (let p = pCurr; p >= 0; p--) {
        const wuKey = `w${p}_${metricKey}_sw0`;
        if (ST.metrics[wuKey] !== undefined && ST.metrics[wuKey] !== '') {
          return ST.metrics[wuKey];
        }
      }
      return defVal;
    }

    // V4.0: checklist Rutin Pemanasan 7 Gerakan (disimpan per pekan & hari)
    function toggleRutinItem(idx) {
      const key = `w${ST.phase}_${ST.day}_r7_${idx}`;
      ST.setsDone[key] = !ST.setsDone[key];
      saveState();
      renderApp();
    }

    function toggleExerciseSet(exId, setIdx, restSec) {
      const key = `w${ST.phase}_${ST.day}_${exId}_s${setIdx}`;
      const nextVal = !ST.setsDone[key];
      ST.setsDone[key] = nextVal;
      saveState();
      if (nextVal && restSec > 0) {
        // Timer istirahat antar-set TANPA prep 3 detik (withPrep = false)
        startFloatingTimer(restSec, `Istirahat Set ${setIdx + 1}`, false);
      }
      renderApp();
    }

    function toggleRunComplete() {
      const key = `w${ST.phase}_${ST.day}_run_done`;
      ST.setsDone[key] = !ST.setsDone[key];
      saveState();
      renderApp();
    }

    // Per-set metric storage (key: w{phase}_{metricKey}_s{setIdx})
    function updateSetMetric(metricKey, setIdx, val) {
      const fullKey = `w${ST.phase}_${metricKey}_s${setIdx}`;
      ST.metrics[fullKey] = val;
      saveState();
    }

    function getSetMetricVal(metricKey, setIdx, defVal) {
      const pCurr = Number(ST.phase);
      // 1. Check current phase per-set value
      const curSetKey = `w${pCurr}_${metricKey}_s${setIdx}`;
      if (ST.metrics[curSetKey] !== undefined && ST.metrics[curSetKey] !== '') {
        return ST.metrics[curSetKey];
      }
      // 2. Check current phase legacy global value (fallback)
      const curLegacyKey = `w${pCurr}_${metricKey}`;
      if (ST.metrics[curLegacyKey] !== undefined && ST.metrics[curLegacyKey] !== '') {
        return ST.metrics[curLegacyKey];
      }
      // 3. Look back at previous phases for the same set index (or legacy global)
      for (let p = pCurr - 1; p >= 0; p--) {
        const prevSetKey = `w${p}_${metricKey}_s${setIdx}`;
        if (ST.metrics[prevSetKey] !== undefined && ST.metrics[prevSetKey] !== '') {
          return ST.metrics[prevSetKey];
        }
        const prevLegacyKey = `w${p}_${metricKey}`;
        if (ST.metrics[prevLegacyKey] !== undefined && ST.metrics[prevLegacyKey] !== '') {
          return ST.metrics[prevLegacyKey];
        }
      }
      return defVal;
    }

    // Global/Run metric storage (used for Run sessions & Master Lift summary fallback)
    function updateMetric(metricKey, val) {
      const fullKey = `w${ST.phase}_${metricKey}`;
      ST.metrics[fullKey] = val;
      if (metricKey === 'test_hr_60') {
        if (Number(ST.phase) === 0) ST.paceHrTest.w0.hr60 = val;
        if (Number(ST.phase) === 4) ST.paceHrTest.w4.hr60 = val;
        if (Number(ST.phase) === 8) ST.paceHrTest.w8.hr60 = val;
      }

      // V3.0 Saklar HR Drift (C.3): HR Jangkar Jumat vs HR Jangkar Ahad sebelumnya (≥ +8 bpm -> Easy Z2 25 mnt)
      let needRender = false;
      if (metricKey === 'run2_anchor_hr') {
        const p = Number(ST.phase);
        const prevSun = getPrevSundayAnchor(p);
        const fri = Number(val);
        if (prevSun !== null && val !== '' && !isNaN(fri)) {
          const key = 'w' + p;
          const drift = (fri - prevSun) >= 8;
          applyRunQueueChange(() => {
            if (!ST.domsLog[key]) ST.domsLog[key] = { score: 2, hrDrift: false };
            if (Boolean(ST.domsLog[key].hrDrift) !== drift) needRender = true;
            ST.domsLog[key].hrDrift = drift;
          });
        }
      }
      saveState();
      if (needRender) renderApp();
    }

    function getMetricVal(metricKey, defVal) {
      const pCurr = Number(ST.phase);
      // Check direct key (e.g. run metrics) or Set 1 (_s0) for Master Lift table
      for (let p = pCurr; p >= 0; p--) {
        const directKey = `w${p}_${metricKey}`;
        if (ST.metrics[directKey] !== undefined && ST.metrics[directKey] !== '') {
          return ST.metrics[directKey];
        }
        const s0Key = `w${p}_${metricKey}_s0`;
        if (ST.metrics[s0Key] !== undefined && ST.metrics[s0Key] !== '') {
          return ST.metrics[s0Key];
        }
      }
      return defVal;
    }

    function toggleAccordion(accId) {
      const el = document.getElementById(accId);
      if (el) el.classList.toggle('open');
    }

    function updateSwimField(field, val) {
      const key = `w${ST.phase}_${ST.day}`;
      if (!ST.swimDone[key]) {
        ST.swimDone[key] = { dur: '20', dist: '', laps: '1', style: 'Dada / Punggung Santai', done: false };
      }
      ST.swimDone[key][field] = val;
      saveState();
      if (field === 'done') renderApp();
    }

    function isDayCompleted(p, dayKey) {
      const exList = (function() {
        const oldPhase = ST.phase;
        ST.phase = p;
        const list = getDayExercises(dayKey);
        ST.phase = oldPhase;
        return list;
      })();

      for (let i = 0; i < exList.length; i++) {
        if (ST.setsDone[`w${p}_${dayKey}_${exList[i].id}_s0`]) return true;
      }
      if (ST.setsDone[`w${p}_${dayKey}_run_done`]) return true;
      return false;
    }

    /* =========================================================================
       10. TAB 1 RENDERER: 🏃 LATIHAN (WORKOUT VIEW)
       ========================================================================= */
    function updateHeaderReadinessPill() {
      const r = getCurrentReadiness(ST.phase, ST.day);
      const pill = document.getElementById('header-readiness-pill');
      const sel = document.getElementById('phase-selector');
      if (sel && Number(sel.value) !== Number(ST.phase)) {
        sel.value = String(ST.phase);
      }
      if (!pill) return;
      pill.className = 'badge-pill';
      if (r.mode === 'green') {
        pill.classList.add('badge-green');
